name: kerne-cust2-g
env:
  TZ: Asia/Shanghai
  CPU: 'mt6895'
  FEIL: 'redmi+xiaomi'
  ANDROID_VERSION: 'android12'
  KERNEL_VERSION: '5.10.246'
  KERNEL_NAME: 'cust'
  REPO_URL: 'https://mirrors.tuna.tsinghua.edu.cn/git/git-repo'

on:
  workflow_dispatch:
    inputs:
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 最大化建筑空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 安装基础依赖（包含 gdb）
        run: |
          sudo apt update
          sudo apt install -y curl bison flex make binutils dwarves git lld zip perl gcc python3 python-is-python3 bc libssl-dev libelf-dev abigail-tools coreutils zstd cmake gdb
          sudo apt install -y libdw-dev libz-dev libiberty-dev
          sudo ln -sf /usr/bin/dd /bin/dd 2>/dev/null || true

      - name: 从源码编译 pahole master（带调试符号）
        run: |
          git clone --recursive --branch master --depth 1 https://git.kernel.org/pub/scm/devel/pahole/pahole.git
          cd pahole
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX=/usr/local -D__LIB=lib ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          /usr/local/bin/pahole --version
          ls -la /usr/local/lib/libdwarves*.so

      - name: 安装 repo 工具
        run: |
          curl -s https://mirrors.tuna.tsinghua.edu.cn/git/git-repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo
          git config --global repo.url https://mirrors.tuna.tsinghua.edu.cn/git/git-repo

      - name: 使用 repo 初始化并同步内核源码（含工具链）
        run: |
          rm -rf kernel_workspace && mkdir kernel_workspace && cd kernel_workspace
          repo init --depth 1 -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync

          # 清理不需要的 ABI 保护符号文件
          rm -f common/android/abi_gki_protected_exports_* 2>/dev/null || true

          # 修改 setlocalversion 去掉 -dirty 标记
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 修改内核配置
        run: |
          cd kernel_workspace
          DEFCONFIG_PATH="common/arch/arm64/configs/gki_defconfig"
          echo -e "\n# Custom additions" >> "$DEFCONFIG_PATH"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG_PATH"
          sed -i '/^CONFIG_DEBUG_INFO\b/d' "$DEFCONFIG_PATH"
          sed -i '/^# CONFIG_DEBUG_INFO is not set\b/d' "$DEFCONFIG_PATH"
          sed -i '/^CONFIG_DEBUG_INFO_BTF\b/d' "$DEFCONFIG_PATH"
          echo "CONFIG_DEBUG_INFO=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_DEBUG_INFO_BTF=y" >> "$DEFCONFIG_PATH"

      - name: 添加内核后缀
        run: |
          cd kernel_workspace
          suffix="${{ github.event.inputs.kernel_suffix }}"
          [ -z "$suffix" ] && suffix="${{ env.KERNEL_NAME }}"
          for f in ./common/scripts/setlocalversion; do
            sed -i "\$s|echo \"\\\$res\"|echo \"-${suffix}\"|" "$f"
          done

      - name: 修补 resolve_btfids.c（将所有未解析符号改为警告）
        run: |
          cd kernel_workspace/common/tools/bpf/resolve_btfids
          cp main.c main.c.bak
          sed -i '/if (!id->id) {/,/^[[:space:]]*}/c\
          if (!id->id) {\
            fprintf(stderr, "WARNING: unresolved symbol %s, ignoring\\n", id->name);\
            return 0;\
          }' main.c
          echo "已修改 resolve_btfids 源码"

      - name: 配置构建环境（自动探测 Clang 并写入配置）
        run: |
          cd kernel_workspace

          # 1. 禁用 regalloc advisor
          sed -i '/regalloc-enable-advisor=release/s/^/# /' common/Makefile

          # 2. 自动查找 clang 可执行文件（任意位置）
          CLANG_BIN=$(find . -path "*/bin/clang" -type f -executable 2>/dev/null | head -1)
          if [ -z "$CLANG_BIN" ]; then
            echo "错误：未找到 clang 可执行文件，请检查 repo sync 是否完整"
            find . -name "clang" -type f 2>/dev/null || echo "无 clang 文件"
            exit 1
          fi
          CLANG_DIR=$(dirname "$CLANG_BIN")
          CLANG_REL_PATH="${CLANG_DIR#$PWD/}"
          echo "检测到 Clang 路径: $CLANG_REL_PATH"

          # 3. 更新 build.config.common
          CONFIG_FILE="common/build.config.common"
          if grep -q "^CLANG_PREBUILT_BIN=" "$CONFIG_FILE"; then
            sed -i "s|^CLANG_PREBUILT_BIN=.*|CLANG_PREBUILT_BIN=$CLANG_REL_PATH|" "$CONFIG_FILE"
          else
            echo "CLANG_PREBUILT_BIN=$CLANG_REL_PATH" >> "$CONFIG_FILE"
          fi

          # 4. 其他必要配置
          sed -i 's/check_defconfig//' ./common/build.config.gki
          echo "CC=clang" >> "$CONFIG_FILE"
          echo "KBUILD_VERBOSE=0" >> "$CONFIG_FILE"

          # 5. 修复 link-vmlinux.sh 中的 dd 路径问题
          LINK_VMLINUX="common/scripts/link-vmlinux.sh"
          if [[ -f "$LINK_VMLINUX" ]]; then
            sed -i 's/| dd of=/| \/usr\/bin\/dd of=/' "$LINK_VMLINUX"
          fi

          # 6. 设置 pahole 路径
          echo "PAHOLE=/usr/local/bin/pahole" >> "$CONFIG_FILE"

      - name: 构建内核（先让编译失败，保留 .tmp_vmlinux.btf）
        run: |
          cd kernel_workspace
          export PATH="/usr/local/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/lib:$LD_LIBRARY_PATH"
          export KBUILD_VERBOSE=0
          export PAHOLE_FLAGS="--skip_encoding_btf_inconsistent_proto --skip_encoding_btf_vars"

          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh 2>&1 | \
            grep -v -E "lexblock__recode_dwarf_types|tag__recode_dwarf_type|couldn't find 0x|couldn't find|DW_TAG_label" || true

          echo "查找 .tmp_vmlinux.btf 文件..."
          find . -name ".tmp_vmlinux.btf" -ls 2>/dev/null || echo "未找到 .tmp_vmlinux.btf"

          if [ -f "out/android12-5.10/common/.tmp_vmlinux.btf" ]; then
            cp "out/android12-5.10/common/.tmp_vmlinux.btf" .tmp_vmlinux.btf
            echo "已复制 .tmp_vmlinux.btf"
          elif [ -f "out/.tmp_vmlinux.btf" ]; then
            cp "out/.tmp_vmlinux.btf" .tmp_vmlinux.btf
            echo "已复制 .tmp_vmlinux.btf"
          elif [ -f ".tmp_vmlinux.btf" ]; then
            echo ".tmp_vmlinux.btf 已存在"
          else
            echo "警告: 未找到 .tmp_vmlinux.btf 文件"
          fi

      - name: 使用 GDB 跟踪 pahole -J 命令（增强断点 + DWARF 版本检测）
        run: |
          cd kernel_workspace
          
          if [ ! -f ".tmp_vmlinux.btf" ]; then
            echo "错误: .tmp_vmlinux.btf 不存在，尝试查找..."
            find . -name "*.btf" -ls 2>/dev/null || echo "未找到任何 .btf 文件"
            exit 1
          fi
          
          echo "=========================================="
          echo "检测 DWARF 版本信息"
          echo "=========================================="
          
          # 使用 readelf 检测 DWARF 版本
          echo "=== DWARF Version Detection ===" > dwarf_info.txt
          echo "File: .tmp_vmlinux.btf" >> dwarf_info.txt
          readelf -S .tmp_vmlinux.btf | grep -E "debug_info|debug_abbrev|debug_line" >> dwarf_info.txt 2>&1
          echo "" >> dwarf_info.txt
          echo "=== Detailed DWARF Info ===" >> dwarf_info.txt
          readelf -wi .tmp_vmlinux.btf 2>/dev/null | head -100 >> dwarf_info.txt
          echo "" >> dwarf_info.txt
          echo "=== DWARF Version from debug_info section ===" >> dwarf_info.txt
          readelf -wi .tmp_vmlinux.btf 2>/dev/null | grep -E "DW_TAG_compile_unit|DW_AT_producer|DW_AT_language|Version" | head -20 >> dwarf_info.txt
          
          # 使用 llvm-dwarfdump 如果可用
          if command -v llvm-dwarfdump &> /dev/null; then
            echo "=== llvm-dwarfdump output ===" >> dwarf_info.txt
            llvm-dwarfdump --version >> dwarf_info.txt 2>&1
            llvm-dwarfdump .tmp_vmlinux.btf 2>/dev/null | head -50 >> dwarf_info.txt
          fi
          
          cat dwarf_info.txt
          
          echo "=========================================="
          echo "开始 GDB 跟踪 pahole -J .tmp_vmlinux.btf"
          echo "=========================================="
          
          cat > gdb_commands.txt << 'EOF'
          set logging file pahole_gdb_output.txt
          set logging on
          set pagination off
          
          # 打印 DWARF 相关库版本
          printf "\n=== DWARF Library Information ===\n"
          # 尝试获取 libdw 版本
          shell printf "libdw version: " && (dpkg -l | grep libdw-dev | awk '{print $3}' || echo "unknown")
          shell printf "elfutils version: " && (eu-readelf --version 2>&1 | head -1 || echo "unknown")
          
          # 关键断点：BTF 编码流程
          break btf_encoder__new
          break btf_encoder__encode
          break btf_encoder__add_type
          break btf_encoder__delete
          
          # DWARF 处理相关断点
          break cu__encode
          break dwarf_cu__create
          break tag__recode_dwarf_type
          break lexblock__recode_dwarf_types
          
          # 添加 DWARF 版本相关断点
          break dwarf_get_units
          break dwarf_begin
          break dwarf_begin_elf
          
          # 运行参数
          run -J .tmp_vmlinux.btf
          
          # 断点命令：打印调用栈和局部变量
          commands 1
            printf "\n>>> Entered btf_encoder__new\n"
            bt 5
            continue
          end
          commands 2
            printf "\n>>> Entered btf_encoder__encode\n"
            bt 5
            info locals
            continue
          end
          commands 3
            printf "\n>>> Entered btf_encoder__add_type\n"
            bt 5
            info locals
            continue
          end
          commands 4
            printf "\n>>> Entered btf_encoder__delete\n"
            bt 5
            continue
          end
          commands 5
            printf "\n>>> Entered cu__encode\n"
            bt 5
            # 尝试打印 DWARF 版本信息
            if dwarf_version
              printf "DWARF version: %d\n", dwarf_version
            end
            continue
          end
          commands 6
            printf "\n>>> Entered dwarf_cu__create\n"
            bt 5
            info locals
            continue
          end
          commands 7
            printf "\n>>> Entered tag__recode_dwarf_type (可能出错)\n"
            bt 5
            info locals
            continue
          end
          commands 8
            printf "\n>>> Entered lexblock__recode_dwarf_types (可能出错)\n"
            bt 5
            info locals
            continue
          end
          commands 9
            printf "\n>>> Entered dwarf_get_units\n"
            bt 3
            continue
          end
          commands 10
            printf "\n>>> Entered dwarf_begin / dwarf_begin_elf\n"
            bt 3
            # 尝试获取 DWARF 版本
            shell echo "Checking DWARF version from debug_info..."
            continue
          end
          
          continue
          quit
          EOF
          
          gdb -batch -x gdb_commands.txt --args /usr/local/bin/pahole -J .tmp_vmlinux.btf 2>&1 | tee pahole_gdb.log
          
          echo "=========================================="
          echo "GDB 跟踪完成"
          echo "=========================================="

      - name: 收集跟踪文件和调试信息
        run: |
          cd kernel_workspace
          mkdir -p gdb_trace
          
          [ -f "pahole_gdb.log" ] && cp pahole_gdb.log gdb_trace/
          [ -f "pahole_gdb_output.txt" ] && cp pahole_gdb_output.txt gdb_trace/
          [ -f ".tmp_vmlinux.btf" ] && cp .tmp_vmlinux.btf gdb_trace/
          [ -f "dwarf_info.txt" ] && cp dwarf_info.txt gdb_trace/
          
          echo "=== System Information ===" > gdb_trace/system_info.txt
          uname -a >> gdb_trace/system_info.txt
          echo "=== pahole version ===" >> gdb_trace/system_info.txt
          /usr/local/bin/pahole --version >> gdb_trace/system_info.txt 2>&1
          echo "=== pahole debug info ===" >> gdb_trace/system_info.txt
          file /usr/local/bin/pahole >> gdb_trace/system_info.txt
          echo "=== Library dependencies ===" >> gdb_trace/system_info.txt
          ldd /usr/local/bin/pahole >> gdb_trace/system_info.txt
          
          echo "=== DWARF Library Versions ===" >> gdb_trace/system_info.txt
          dpkg -l | grep -E "libdw|elfutils|dwarves" >> gdb_trace/system_info.txt 2>&1
          echo "=== eu-readelf version ===" >> gdb_trace/system_info.txt
          eu-readelf --version 2>&1 | head -1 >> gdb_trace/system_info.txt
          
          echo "=== .tmp_vmlinux.btf file info ===" >> gdb_trace/system_info.txt
          ls -la gdb_trace/.tmp_vmlinux.btf 2>/dev/null || echo "文件不存在" >> gdb_trace/system_info.txt
          file gdb_trace/.tmp_vmlinux.btf 2>/dev/null >> gdb_trace/system_info.txt
          
          echo "=== .tmp_vmlinux.btf sections ===" >> gdb_trace/system_info.txt
          readelf -S gdb_trace/.tmp_vmlinux.btf 2>/dev/null >> gdb_trace/system_info.txt || echo "无法读取" >> gdb_trace/system_info.txt
          
          echo "=== DWARF Version Analysis ===" >> gdb_trace/system_info.txt
          echo "Detecting DWARF version from .tmp_vmlinux.btf:" >> gdb_trace/system_info.txt
          readelf -wi gdb_trace/.tmp_vmlinux.btf 2>/dev/null | grep -E "DW_TAG_compile_unit|DW_AT_producer|Version" | head -30 >> gdb_trace/system_info.txt
          
          # 使用 objdump 检测 DWARF 版本
          echo "=== objdump DWARF info ===" >> gdb_trace/system_info.txt
          objdump --dwarf=info gdb_trace/.tmp_vmlinux.btf 2>/dev/null | head -50 >> gdb_trace/system_info.txt
          
          echo "跟踪文件已收集到 gdb_trace 目录"
          ls -la gdb_trace/

      - name: 上传 GDB 跟踪工件
        uses: actions/upload-artifact@v4
        with:
          name: GDB_Trace_Artifacts
          path: kernel_workspace/gdb_trace/

      - name: 最终构建内核
        run: |
          cd kernel_workspace
          export PATH="/usr/local/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/lib:$LD_LIBRARY_PATH"
          export KBUILD_VERBOSE=0
          export PAHOLE_FLAGS="--skip_encoding_btf_inconsistent_proto --skip_encoding_btf_vars"
          
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh 2>&1 | \
            grep -v -E "lexblock__recode_dwarf_types|tag__recode_dwarf_type|couldn't find 0x|couldn't find|DW_TAG_label" || \
            { exit_code=${PIPESTATUS[0]}; if [ $exit_code -ne 0 ]; then exit $exit_code; fi; }
          
          echo "内核编译完成！"

      - name: 上传额外构建文件
        run: |
          cd kernel_workspace
          mkdir -p build_artifacts
          [ -f "out/android12-5.10/common/.config" ] && cp "out/android12-5.10/common/.config" build_artifacts/config
          [ -f "out/android12-5.10/common/Module.symvers" ] && cp "out/android12-5.10/common/Module.symvers" build_artifacts/
          [ -f "out/android12-5.10/common/abi_symbollist.raw" ] && cp "out/android12-5.10/common/abi_symbollist.raw" build_artifacts/
          [ -f "build/abi/compare_to_symbol_list" ] && cp "build/abi/compare_to_symbol_list" build_artifacts/

      - name: 上传构建工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Build_Artifacts
          path: kernel_workspace/build_artifacts/

      - name: 打包 AnyKernel3
        run: |
          cd kernel_workspace
          git clone https://github.com/Winkmoon/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          IMAGE_FILE=$(find . -name Image | head -n1)
          if [[ ! -f "$IMAGE_FILE" ]]; then
            echo "错误：未找到 Image 文件"
            exit 1
          fi
          cp "$IMAGE_FILE" AnyKernel3/
          cd AnyKernel3
          echo "${{ env.KERNEL_VERSION }}" > kernel_version.txt
          ZIPNAME="AnyKernel3_${{ env.KERNEL_VERSION }}.zip"
          zip -r "../$ZIPNAME" ./*

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: kernel_workspace/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ./release_zips

      - name: 创建 Release
        id: vars
        run: |
          ZIP_FILE=$(ls ./release_zips/*.zip | head -n1)
          KERNEL_VER=$(unzip -p "$ZIP_FILE" kernel_version.txt 2>/dev/null || echo "${{ env.KERNEL_VERSION }}")
          suffix="${{ github.event.inputs.kernel_suffix }}"
          [ -z "$suffix" ] && suffix="${{ env.KERNEL_NAME }}"
          FULL_VERSION="${KERNEL_VER}-${suffix}"
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          TAG_NAME="${{ env.KERNEL_VERSION }}-${{ env.KERNEL_NAME }}-${TIME}"
          echo "FULL_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "TIME_FORM=${TIME_FORM}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "内核 ${{ env.FULL_VERSION }}"
          body: |
            自动构建于 ${{ env.TIME_FORM }}
            内核版本：${{ env.FULL_VERSION }}
            设备：${{ env.CPU }} / ${{ env.FEIL }}
            Android 版本：${{ env.ANDROID_VERSION }}
          files: ./release_zips/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
