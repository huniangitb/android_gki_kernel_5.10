name: kerne-cust-esk
env:
  TZ: Asia/Shanghai
  CPU: 'mt6895'
  FEIL: 'redmi+xiaomi'
  ANDROID_VERSION: 'android12'
  KERNEL_VERSION: '5.10.246'
  KERNEL_NAME: 'cust'

on:
  workflow_dispatch:
    inputs:
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_success: ${{ steps.check_build.outputs.build_success }}
    steps:
      - name: 最大化建筑空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 安装基础依赖
        run: |
          sudo apt update
          sudo apt install -y curl bison flex make binutils dwarves git lld zip perl gcc python3 python-is-python3 bc libssl-dev libelf-dev abigail-tools coreutils zstd cmake gdb
          sudo apt install -y libdw-dev libz-dev libiberty-dev
          sudo ln -sf /usr/bin/dd /bin/dd 2>/dev/null || true

      - name: 缓存 pahole 源码
        id: cache-pahole
        uses: actions/cache@v4
        with:
          path: pahole
          key: pahole-master-${{ runner.os }}

      - name: 编译 pahole master
        if: steps.cache-pahole.outputs.cache-hit != 'true'
        run: |
          git clone --recursive --branch master --depth 1 https://git.kernel.org/pub/scm/devel/pahole/pahole.git
          cd pahole
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX=/usr/local -D__LIB=lib ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: 使用缓存的 pahole
        if: steps.cache-pahole.outputs.cache-hit == 'true'
        run: |
          cd pahole/build
          sudo make install
          sudo ldconfig

      - name: 安装 repo 工具
        run: |
          curl -s https://mirrors.tuna.tsinghua.edu.cn/git/git-repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo
          git config --global repo.url https://mirrors.tuna.tsinghua.edu.cn/git/git-repo

      - name: 缓存内核源码
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: kernel_workspace/common
          key: kernel-mt6895-16.2-rebase-${{ runner.os }}

      - name: 缓存 Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: kernel_workspace/prebuilts-master/clang/host/linux-x86/clang-r584948b
          key: clang-r584948b-${{ runner.os }}

      - name: 初始化源码仓库
        run: |
          rm -rf kernel_workspace && mkdir kernel_workspace && cd kernel_workspace
          
          # 下载工具包
          wget -q --timeout=30 --tries=30 \
            https://github.com/huniangitb/Clang-r584948b/releases/download/v1.0.0/common-android12-5.10.tar.zst \
            -O common-android12-5.10.tar.zst
          tar -I zstd -xf common-android12-5.10.tar.zst
          
          # 克隆内核源码
          if [ ! -d "common" ]; then
            git clone --depth=1 --branch 16.2-rebase https://github.com/ESK-Project/android_kernel_xiaomi_mt6895 common
          fi
          
          # 清理（忽略错误）
          rm common/android/abi_gki_protected_exports_* 2>/dev/null || true

      - name: 下载并安装 Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          cd kernel_workspace
          wget -q https://github.com/huniangitb/Clang-r584948b/releases/download/v1.0.0/linux-x86-kernel-clang-r584948b.tar.gz -O clang-r584948b.tar.gz
          mkdir -p prebuilts-master/clang/host/linux-x86/clang-r584948b
          tar -xzf clang-r584948b.tar.gz -C prebuilts-master/clang/host/linux-x86/clang-r584948b

      - name: 修改内核配置
        run: |
          cd kernel_workspace
          DEFCONFIG=$(find common/arch/arm64/configs -name "*defconfig" | head -1)
          if [ -n "$DEFCONFIG" ]; then
            # 基本配置
            echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"
            echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
            echo "CONFIG_DEBUG_INFO=y" >> "$DEFCONFIG"
            echo "CONFIG_DEBUG_INFO_BTF=y" >> "$DEFCONFIG"
            
            # 修复 Mali GPU 平台配置
            echo "CONFIG_MALI_PLATFORM_NAME=\"mt6895\"" >> "$DEFCONFIG"
            echo "CONFIG_MALI_MIDGARD=y" >> "$DEFCONFIG"
            echo "CONFIG_MALI_DEVFREQ=y" >> "$DEFCONFIG"
            echo "CONFIG_MALI_PLATFORM_THIRDPARTY_NAME=\"mediatek\"" >> "$DEFCONFIG"
            
            echo "已添加 Mali 平台配置"
          fi

      - name: 添加内核后缀
        run: |
          cd kernel_workspace
          suffix="${{ github.event.inputs.kernel_suffix }}"
          [ -z "$suffix" ] && suffix="${{ env.KERNEL_NAME }}"
          for f in ./common/scripts/setlocalversion; do
            [ -f "$f" ] && sed -i "\$s|echo \"\\\$res\"|echo \"-${suffix}\"|" "$f" 2>/dev/null || true
          done

      - name: 修补 resolve_btfids.c
        run: |
          cd kernel_workspace/common/tools/bpf/resolve_btfids
          [ -f main.c ] && sed -i '/if (!id->id) {/,/^[[:space:]]*}/c\
          if (!id->id) {\
            fprintf(stderr, "WARNING: unresolved symbol %s, ignoring\\n", id->name);\
            return 0;\
          }' main.c || true

      - name: 配置构建环境
        run: |
          cd kernel_workspace
          CLANG_PATH="prebuilts-master/clang/host/linux-x86/clang-r584948b/bin"
          if [ -f "common/build.config.common" ]; then
            sed -i "s|CLANG_PREBUILT_BIN=.*|CLANG_PREBUILT_BIN=$CLANG_PATH|" common/build.config.common 2>/dev/null || true
            echo "CC=clang" >> common/build.config.common
            echo "PAHOLE=/usr/local/bin/pahole" >> common/build.config.common
          fi

      - name: 构建内核
        id: build_kernel
        run: |
          cd kernel_workspace
          export PATH="/usr/local/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/lib:$LD_LIBRARY_PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 使用 defconfig
          cd common
          DEFCONFIG=$(find arch/arm64/configs -name "*defconfig" | head -1)
          echo "使用 defconfig: $DEFCONFIG"
          
          # 生成 .config
          make ARCH=arm64 CC=clang LD=ld.lld $DEFCONFIG
          
          # 构建内核
          make ARCH=arm64 CC=clang LD=ld.lld -j$(nproc) 2>&1 | tee ../build_output.log
          cd ..
          
          # 检查 Image 是否存在
          IMAGE_FILE=$(find . -name "Image" | head -1)
          if [ -n "$IMAGE_FILE" ]; then
            echo "build_success=true" >> $GITHUB_OUTPUT
            mkdir -p build_artifacts
            cp "$IMAGE_FILE" build_artifacts/
            echo "内核构建成功"
          else
            echo "build_success=false" >> $GITHUB_OUTPUT
            echo "内核构建失败"
            # 显示错误日志最后100行
            tail -100 build_output.log
          fi

      - name: 设置输出
        id: check_build
        run: |
          echo "build_success=${{ steps.build_kernel.outputs.build_success }}" >> $GITHUB_OUTPUT

      - name: 打包 AnyKernel3
        if: steps.build_kernel.outputs.build_success == 'true'
        run: |
          cd kernel_workspace
          git clone https://github.com/Winkmoon/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          IMAGE_FILE=$(find . -name Image | head -1)
          cp "$IMAGE_FILE" AnyKernel3/
          cd AnyKernel3
          echo "${{ env.KERNEL_VERSION }}" > kernel_version.txt
          zip -r "../AnyKernel3_${{ env.KERNEL_VERSION }}.zip" ./*

      - name: 上传 ZIP
        uses: actions/upload-artifact@v4
        if: steps.build_kernel.outputs.build_success == 'true'
        with:
          name: Kernel_ZIP
          path: kernel_workspace/*.zip

      - name: 上传构建日志（失败时）
        uses: actions/upload-artifact@v4
        if: steps.build_kernel.outputs.build_success != 'true'
        with:
          name: Build_Logs
          path: kernel_workspace/build_output.log

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: needs.build.outputs.build_success == 'true'
    steps:
      - name: 下载 ZIP
        uses: actions/download-artifact@v4
        with:
          name: Kernel_ZIP
          path: ./release_zips

      - name: 创建 Release
        id: vars
        run: |
          ZIP_FILE=$(ls ./release_zips/*.zip | head -1)
          suffix="${{ github.event.inputs.kernel_suffix }}"
          [ -z "$suffix" ] && suffix="${{ env.KERNEL_NAME }}"
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          TAG_NAME="${{ env.KERNEL_VERSION }}-${suffix}-${TIME}"
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "TIME_FORM=${TIME_FORM}" >> $GITHUB_ENV

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "内核 ${{ env.KERNEL_VERSION }}-${{ env.KERNEL_NAME }}"
          body: |
            自动构建于 ${{ env.TIME_FORM }}
            设备：${{ env.CPU }} / ${{ env.FEIL }}
            源码分支：16.2-rebase
          files: ./release_zips/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
