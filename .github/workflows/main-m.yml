name: kernel-cust-m

env:
  TZ: Asia/Shanghai
  CPU: 'mt6895'
  FEIL: 'redmi+xiaomi'
  ANDROID_VERSION: 'android12'
  KERNEL_VERSION: '5.10.246'
  KERNEL_NAME: 'cust'
  REPO_URL: 'https://mirrors.tuna.tsinghua.edu.cn/git/git-repo'
  GCC_URL: 'https://github.com/huniangitb/Clang-r584948b/releases/download/v1.0.0/aarch64-linux-android-4.9-refs_tags_android-12.1.0_r27.tar.gz'
  CLANG_URL: 'https://github.com/huniangitb/Clang-r584948b/releases/download/v1.0.0/linux-x86-kernel-clang-r584948b.tar.gz'
  KERNEL_SOURCE_URL: 'https://github.com/ztc1997/android_gki_kernel_5.10_common'
  GKI_TOOL_PACKAGE: 'https://github.com/huniangitb/Clang-r584948b/releases/download/v1.0.0/common-android12-5.10.tar.zst'
  
  # 能开机内核的符号列表文件（直接使用，不再手动合并）
  BOOTABLE_MODULE_SYMVERS_URL: 'https://github.com/huniangitb/Clang-r584948b/releases/download/vConfg/Module.symvers'
  BOOTABLE_WHITELIST_URL: 'https://github.com/huniangitb/Clang-r584948b/releases/download/vConfg/abi_symbollist.raw'
  
  # KMI 配置
  TRIM_NONLISTED_KMI: 1          # 修剪不在白名单中的符号
  KMI_SYMBOL_LIST_STRICT_MODE: 1 # 严格校验（1:1 匹配）
  KMI_ENFORCED: 1                # 校验失败则中断构建

on:
  workflow_dispatch:
    inputs:
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 最大化建筑空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 安装基础依赖
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl ca-certificates \
            flex git kmod libelf-dev libssl-dev lz4 make ncurses-dev \
            openssl python3 python3-pip wget xz-utils zstd cpio dwarves

      - name: 创建目录并下载工具链和源码
        run: |
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace
          cd $GITHUB_WORKSPACE/kernel_workspace
          
          wget -q -c ${{ env.GCC_URL }} -O gcc-aarch64.tar.gz
          mkdir -p gcc && tar -xf gcc-aarch64.tar.gz -C gcc
          
          wget -q -c ${{ env.CLANG_URL }} -O clang.tar.gz
          mkdir -p clang && tar -xf clang.tar.gz -C clang
          
          git clone --depth=1 ${{ env.KERNEL_SOURCE_URL }} -b android12-5.10-2025-09 kernel
          
          wget -q -c --timeout=30 --tries=30 ${{ env.GKI_TOOL_PACKAGE }} -O gki_tools.tar.zst
          mkdir -p gki_tools && tar -xf gki_tools.tar.zst -C gki_tools

      - name: 下载能开机内核的符号列表（作为白名单基准）
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/kernel
          mkdir -p out
          
          # 下载能开机内核的 Module.symvers（用于对比差异）
          wget -q --timeout=30 --tries=3 ${{ env.BOOTABLE_MODULE_SYMVERS_URL }} -O out/bootable_Module.symvers || {
            echo "错误：无法下载能开机内核的 Module.symvers" >&2
            exit 1
          }
          
          # 下载能开机内核的扁平白名单（直接用作内核白名单）
          wget -q --timeout=30 --tries=3 ${{ env.BOOTABLE_WHITELIST_URL }} -O out/abi_symbollist.raw || {
            echo "错误：无法下载能开机内核的 abi_symbollist.raw" >&2
            exit 1
          }
          
          echo "已下载能开机内核的白名单，共 $(wc -l < out/abi_symbollist.raw) 行"

      - name: 修改内核配置并启用 KMI 修剪
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/kernel
          
          sed -i '/regalloc-enable-advisor=release/s/^/# /' Makefile
          
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang/bin:$PATH
          export CROSS_COMPILE=$GITHUB_WORKSPACE/kernel_workspace/gcc/bin/aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # 生成基础配置
          make ARCH=arm64 mrproper CC=clang LD=ld.lld \
            CROSS_COMPILE=$CROSS_COMPILE \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            O=out LLVM=1 LLVM_IAS=1
          
          make ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=$CROSS_COMPILE \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            O=out LLVM=1 LLVM_IAS=1 gki_defconfig
          
          # 添加自定义配置
          echo 'CONFIG_TMPFS_POSIX_ACL=y' >> arch/arm64/configs/gki_defconfig
          echo 'CONFIG_TMPFS_XATTR=y' >> arch/arm64/configs/gki_defconfig
          echo 'CONFIG_DEBUG_INFO_BTF=y' >> arch/arm64/configs/gki_defconfig
          sed -i 's/CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_CLANG_THIN=y/g' arch/arm64/configs/gki_defconfig
          
          make ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=$CROSS_COMPILE \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            O=out LLVM=1 LLVM_IAS=1 gki_defconfig
          
          # 使用下载的白名单启用 KMI 修剪（绝对路径）
          scripts/config --file out/.config \
            -d UNUSED_SYMBOLS \
            -e TRIM_UNUSED_KSYMS \
            --set-str UNUSED_KSYMS_WHITELIST "$PWD/out/abi_symbollist.raw"
          
          make ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=$CROSS_COMPILE \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            O=out LLVM=1 LLVM_IAS=1 olddefconfig
          
          grep "CONFIG_TRIM_UNUSED_KSYMS" out/.config
          grep "CONFIG_UNUSED_KSYMS_WHITELIST" out/.config

      - name: 编译内核
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang/bin:$PATH
          export CROSS_COMPILE=$GITHUB_WORKSPACE/kernel_workspace/gcc/bin/aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          make -C kernel O=out ARCH=arm64 \
            CC=clang LD=ld.lld \
            CROSS_COMPILE=$CROSS_COMPILE \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            LLVM=1 LLVM_IAS=1 \
            -j$(nproc --all)
          
          ls -l kernel/out/arch/arm64/boot/Image
          
          # 检查 vmlinux.btf 是否存在
          if [ -f "kernel/out/vmlinux.btf" ]; then
            echo "✓ vmlinux.btf 已生成"
            ls -lh kernel/out/vmlinux.btf
          else
            echo "⚠ 警告: vmlinux.btf 未生成，请检查 BTF 配置"
          fi

      - name: 对比当前内核导出符号与能开机内核的差异
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/kernel
          
          # 提取当前内核实际导出的符号
          awk '{print $2}' out/Module.symvers | sort -u > out/current_exported.txt
          
          # 提取能开机内核实际导出的符号（基准）
          awk '{print $2}' out/bootable_Module.symvers | sort -u > out/bootable_exported.txt
          
          echo "=========================================="
          echo "KMI 符号差异报告"
          echo "=========================================="
          
          # 能开机有，当前没有 → 缺失符号（可能导致无法开机）
          comm -23 out/bootable_exported.txt out/current_exported.txt > out/missing_symbols.txt
          MISSING=$(wc -l < out/missing_symbols.txt)
          echo "缺失的符号（能开机有，当前无）: $MISSING"
          if [ $MISSING -gt 0 ]; then
            echo "前20个缺失符号："
            head -20 out/missing_symbols.txt
          fi
          
          # 当前有，能开机没有 → 多余符号（KMI 膨胀）
          comm -13 out/bootable_exported.txt out/current_exported.txt > out/extra_symbols.txt
          EXTRA=$(wc -l < out/extra_symbols.txt)
          echo "多余的符号（当前有，能开机无）: $EXTRA"
          if [ $EXTRA -gt 0 ]; then
            echo "前20个多余符号："
            head -20 out/extra_symbols.txt
          fi
          
          # 生成完整差异文件供上传
          echo "=== 缺失符号 ===" > out/kmi_diff.txt
          cat out/missing_symbols.txt >> out/kmi_diff.txt
          echo "" >> out/kmi_diff.txt
          echo "=== 多余符号 ===" >> out/kmi_diff.txt
          cat out/extra_symbols.txt >> out/kmi_diff.txt

      - name: 严格模式校验（使用能开机内核的白名单）
        if: env.KMI_SYMBOL_LIST_STRICT_MODE == '1'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/kernel
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/gki_tools/prebuilts/build-tools/linux-x86/bin:$PATH
          chmod +x $GITHUB_WORKSPACE/kernel_workspace/gki_tools/build/abi/compare_to_symbol_list
          
          echo "=========================================="
          echo "严格模式 KMI 符号校验（与能开机内核白名单对比）"
          echo "=========================================="
          
          # 使用下载的白名单进行严格校验
          if $GITHUB_WORKSPACE/kernel_workspace/gki_tools/build/abi/compare_to_symbol_list \
            out/Module.symvers out/abi_symbollist.raw; then
            echo "✓ 严格模式校验通过"
          else
            echo "✗ 严格模式校验失败"
            if [ "${{ env.KMI_ENFORCED }}" = "1" ]; then
              exit 1
            else
              echo "警告: KMI_ENFORCED=0，继续构建"
            fi
          fi

      - name: 打包 AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/Winkmoon/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          echo "${{ env.KERNEL_VERSION }}" > AnyKernel3/kernel_version.txt
          cp kernel/out/kmi_diff.txt AnyKernel3/ 2>/dev/null || true
          cd AnyKernel3
          zip -r "../AnyKernel3_${{ env.KERNEL_VERSION }}.zip" ./*

      - name: 打包 vmlinux.btf 为独立 ZIP
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          
          # 创建 vmlinux.btf 的打包目录
          mkdir -p btf_package
          
          # 检查并复制 vmlinux.btf 文件
          if [ -f "kernel/out/vmlinux.btf" ]; then
            cp kernel/out/vmlinux.btf btf_package/
            echo "vmlinux.btf 已复制到打包目录"
            
            # 同时复制符号差异报告（可选）
            cp kernel/out/kmi_diff.txt btf_package/ 2>/dev/null || true
            
            # 添加版本信息
            echo "${{ env.KERNEL_VERSION }}" > btf_package/kernel_version.txt
            echo "${{ github.event.inputs.kernel_suffix }}" > btf_package/kernel_suffix.txt 2>/dev/null || true
            
            # 打包为 ZIP
            zip -r "vmlinux_btf_${{ env.KERNEL_VERSION }}.zip" btf_package/*
            
            echo "✓ vmlinux.btf 打包完成: vmlinux_btf_${{ env.KERNEL_VERSION }}.zip"
            ls -lh "vmlinux_btf_${{ env.KERNEL_VERSION }}.zip"
          else
            echo "⚠ vmlinux.btf 文件不存在，跳过打包"
          fi

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: |
            ${{ github.workspace }}/kernel_workspace/*.zip
            ${{ github.workspace }}/kernel_workspace/vmlinux_btf_*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ./release_zips

      - name: 创建 Release
        id: vars
        run: |
          ZIP_FILE=$(ls ./release_zips/AnyKernel3_*.zip | head -n1)
          BTF_ZIP=$(ls ./release_zips/vmlinux_btf_*.zip 2>/dev/null | head -n1)
          KERNEL_VER=$(unzip -p "$ZIP_FILE" kernel_version.txt 2>/dev/null || echo "${{ env.KERNEL_VERSION }}")
          suffix="${{ github.event.inputs.kernel_suffix }}"
          [ -z "$suffix" ] && suffix="${{ env.KERNEL_NAME }}"
          FULL_VERSION="${KERNEL_VER}-${suffix}"
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          TAG_NAME="${{ env.KERNEL_VERSION }}-${{ env.KERNEL_NAME }}-${TIME}"
          echo "FULL_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "TIME_FORM=${TIME_FORM}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "BTF_ZIP=${BTF_ZIP}" >> $GITHUB_ENV

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "内核 ${{ env.FULL_VERSION }}"
          body: |
            自动构建于 ${{ env.TIME_FORM }}
            内核版本：${{ env.FULL_VERSION }}
            设备：${{ env.CPU }} / ${{ env.FEIL }}
            Android 版本：${{ env.ANDROID_VERSION }}
            注意:仅用于调试使用,内核并不能开机      
            **包含文件：**
            - AnyKernel3 刷机包（内核镜像）
            - vmlinux.btf BTF 调试文件（用于 eBPF/BPF 工具）
          files: |
            ./release_zips/AnyKernel3_*.zip
            ${{ env.BTF_ZIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
