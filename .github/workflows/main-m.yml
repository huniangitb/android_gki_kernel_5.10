name: kerne-cust-btf
env:
  TZ: Asia/Shanghai
  CPU: 'mt6895'
  FEIL: 'redmi+xiaomi'
  ANDROID_VERSION: 'android12'
  KERNEL_VERSION: '5.10.246'
  KERNEL_NAME: 'cust'

on:
  workflow_dispatch:
    inputs:
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 最大化建筑空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 安装基础依赖
        run: |
          sudo apt update
          sudo apt install -y curl bison flex make binutils dwarves git lld pahole zip perl python3 python-is-python3 bc libssl-dev libelf-dev abigail-tools coreutils pahole

      - name: 初始化源码仓库
        run: |
          rm -rf kernel_workspace && mkdir kernel_workspace && cd kernel_workspace
          wget -q -c --show-progress --timeout=30 --tries=30 \
            https://github.com/huniangitb/Clang-r584948b/releases/download/v1.0.0/common-android12-5.10.tar.zst \
            -O common-android12-5.10.tar.zst
          tar -I zstd -xf common-android12-5.10.tar.zst
          rm -rf common 2>/dev/null || true
          git clone --depth=1 https://github.com/ztc1997/android_gki_kernel_5.10_common common -b android12-5.10-2025-09
          rm common/android/abi_gki_protected_exports_* 2>/dev/null || true
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 直接修改 gki_defconfig
        run: |
          cd kernel_workspace
          DEFCONFIG_PATH="common/arch/arm64/configs/gki_defconfig"
          echo -e "\n# Custom additions" >> "$DEFCONFIG_PATH"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_DEBUG_INFO_BTF=y" >> "$DEFCONFIG_PATH"

      - name: 下载并安装工具链 (Clang & GCC)
        run: |
          cd kernel_workspace
          # 下载 Clang
          wget -q -c --show-progress https://github.com/huniangitb/Clang-r584948b/releases/download/v1.0.0/linux-x86-kernel-clang-r584948b.tar.gz -O clang.tar.gz
          mkdir -p prebuilts/clang/host/linux-x86/clang-r584948b
          tar -xzf clang.tar.gz -C prebuilts/clang/host/linux-x86/clang-r584948b
          
          # 下载 GCC
          wget -q -c --show-progress https://github.com/huniangitb/Clang-r584948b/releases/download/v1.0.0/aarch64-linux-android-4.9-refs_tags_android-12.1.0_r27.tar.gz -O gcc.tar.gz
          mkdir -p prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          tar -xzf gcc.tar.gz -C prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9

      - name: 添加内核名称后缀
        run: |
          cd kernel_workspace
          suffix="${{ github.event.inputs.kernel_suffix || env.KERNEL_NAME }}"
          for f in ./common/scripts/setlocalversion; do
            sed -i "\$s|echo \"\\\$res\"|echo \"-${suffix}\"|" "$f"
          done

      - name: 配置构建环境
        run: |
          cd kernel_workspace
          # 禁用 MLGO
          sed -i '/regalloc-enable-advisor=release/s/^/# /' common/Makefile
          
          # 设置工具链路径
          CLANG_BIN="$(pwd)/prebuilts/clang/host/linux-x86/clang-r584948b/bin"
          GCC_BIN="$(pwd)/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin"
          export PATH="$CLANG_BIN:$GCC_BIN:$PATH"
          clang -v
          # 注入配置
          sed -i "/^CLANG_PREBUILT_BIN=/c\CLANG_PREBUILT_BIN=$CLANG_BIN" common/build.config.common
          sed -i "/^CROSS_COMPILE=/c\CROSS_COMPILE=$GCC_BIN/aarch64-linux-gnu-" common/build.config.aarch64
          
          # 移除检查
          sed -i 's/check_defconfig//' ./common/build.config.gki
          
          # 修复 dd
          if [[ -f "common/scripts/link-vmlinux.sh" ]]; then
            sed -i 's/| dd of=/| \/usr\/bin\/dd of=/' common/scripts/link-vmlinux.sh
          fi

      - name: 构建内核
        run: |
          cd kernel_workspace
          CLANG_BIN="$(pwd)/prebuilts/clang/host/linux-x86/clang-r584948b/bin"
          GCC_BIN="$(pwd)/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin"
          export PATH="$CLANG_BIN:$GCC_BIN:$PATH"
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: 整理工件
        run: |
          cd kernel_workspace
          mkdir -p build_artifacts
          cp out/android12-5.10/common/.config build_artifacts/config || true
          cp out/android12-5.10/common/Module.symvers build_artifacts/ || true
          cp out/android12-5.10/common/abi_symbollist.raw build_artifacts/ || true
          cp build/abi/compare_to_symbol_list build_artifacts/ || true

      - name: 上传构建工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Build_Artifacts
          path: kernel_workspace/build_artifacts/

      - name: 打包 AnyKernel3
        run: |
          cd kernel_workspace
          git clone https://github.com/Winkmoon/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          IMAGE_FILE=$(find . -name Image | head -n1)
          cp "$IMAGE_FILE" AnyKernel3/
          cd AnyKernel3
          echo "${{ env.KERNEL_VERSION }}" > kernel_version.txt
          zip -r "../AnyKernel3_${{ env.KERNEL_VERSION }}.zip" ./*

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: kernel_workspace/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ./release_zips

      - name: 准备发布
        id: vars
        run: |
          ZIP_FILE=$(ls ./release_zips/*.zip | head -n1)
          KERNEL_VER=$(unzip -p "$ZIP_FILE" kernel_version.txt 2>/dev/null || echo "${{ env.KERNEL_VERSION }}")
          SUFFIX="${{ github.event.inputs.kernel_suffix || env.KERNEL_NAME }}"
          FULL_VERSION="${KERNEL_VER}-${SUFFIX}"
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          echo "FULL_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "TAG_NAME=${KERNEL_VER}-${SUFFIX}-${TIME}" >> $GITHUB_ENV

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "内核 ${{ env.FULL_VERSION }}"
          body: "自动构建于 ${{ env.TAG_NAME }}"
          files: ./release_zips/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
