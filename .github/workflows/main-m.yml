name: kernel-cust-m

env:
  TZ: Asia/Shanghai
  CPU: 'mt6895'
  FEIL: 'redmi+xiaomi'
  ANDROID_VERSION: 'android12'
  KERNEL_VERSION: '5.10.246'
  KERNEL_NAME: 'cust'
  REPO_URL: 'https://mirrors.tuna.tsinghua.edu.cn/git/git-repo'
  GCC_URL: 'https://github.com/huniangitb/Clang-r584948b/releases/download/v1.0.0/aarch64-linux-android-4.9-refs_tags_android-12.1.0_r27.tar.gz'
  CLANG_URL: 'https://github.com/huniangitb/Clang-r584948b/releases/download/v1.0.0/linux-x86-kernel-clang-r584948b.tar.gz'
  KERNEL_SOURCE_URL: 'https://github.com/ztc1997/android_gki_kernel_5.10_common'
  GKI_TOOL_PACKAGE: 'https://github.com/huniangitb/Clang-r584948b/releases/download/v1.0.0/common-android12-5.10.tar.zst'
  
  # KMI 配置
  KMI_SYMBOL_LIST: 'android/abi_gki_aarch64'
  TRIM_NONLISTED_KMI: 1
  KMI_SYMBOL_LIST_STRICT_MODE: 1
  KMI_ENFORCED: 1

on:
  workflow_dispatch:
    inputs:
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 最大化建筑空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 安装基础依赖
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl ca-certificates \
            flex git kmod libelf-dev libssl-dev lz4 make ncurses-dev \
            openssl python3 python3-pip wget xz-utils zstd cpio dwarves

      - name: 创建目录并下载工具链和源码
        run: |
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace
          cd $GITHUB_WORKSPACE/kernel_workspace
          
          wget -q -c ${{ env.GCC_URL }} -O gcc-aarch64.tar.gz
          mkdir -p gcc && tar -xf gcc-aarch64.tar.gz -C gcc
          
          wget -q -c ${{ env.CLANG_URL }} -O clang.tar.gz
          mkdir -p clang && tar -xf clang.tar.gz -C clang
          
          git clone --depth=1 ${{ env.KERNEL_SOURCE_URL }} -b android12-5.10-2025-09 kernel
          
          wget -q -c --timeout=30 --tries=30 ${{ env.GKI_TOOL_PACKAGE }} -O gki_tools.tar.zst
          mkdir -p gki_tools && tar -xf gki_tools.tar.zst -C gki_tools

      - name: 准备 KMI 符号列表（合并主列表与附加列表）
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/kernel
          mkdir -p out
          
          # 定义附加符号列表数组
          ADDITIONAL_LISTS="
            android/abi_gki_aarch64_type_visibility
            android/abi_gki_aarch64_arg
            android/abi_gki_aarch64_core
            android/abi_gki_aarch64_db845c
            android/abi_gki_aarch64_exynos
            android/abi_gki_aarch64_exynosauto
            android/abi_gki_aarch64_fips140
            android/abi_gki_aarch64_galaxy
            android/abi_gki_aarch64_generic
            android/abi_gki_aarch64_hikey960
            android/abi_gki_aarch64_honor
            android/abi_gki_aarch64_imx
            android/abi_gki_aarch64_lenovo
            android/abi_gki_aarch64_moto
            android/abi_gki_aarch64_mtk
            android/abi_gki_aarch64_nothing
            android/abi_gki_aarch64_oplus
            android/abi_gki_aarch64_qcom
            android/abi_gki_aarch64_rockchip
            android/abi_gki_aarch64_unisoc
            android/abi_gki_aarch64_virtual_device
            android/abi_gki_aarch64_vivo
            android/abi_gki_aarch64_xiaomi
            android/abi_gki_aarch64_zebra
            android/abi_gki_aarch64_asus
            android/abi_gki_aarch64_transsion
            android/abi_gki_aarch64_tuxera
          "
          
          # 复制主符号列表
          cp ${{ env.KMI_SYMBOL_LIST }} out/abi_symbollist
          
          # 合并附加符号列表
          for list in $ADDITIONAL_LISTS; do
            if [ -f "$list" ]; then
              echo "" >> out/abi_symbollist
              cat "$list" >> out/abi_symbollist
              echo "已添加: $list"
            else
              echo "警告: 符号列表文件不存在: $list"
            fi
          done
          
          # 清理：移除注释和空行
          sed -i '/^\s*#/d; /^\s*$/d' out/abi_symbollist
          
          SYM_COUNT=$(wc -l < out/abi_symbollist)
          echo "合并后的符号列表位于 out/abi_symbollist，共 ${SYM_COUNT} 行"
          
          if [ ${SYM_COUNT} -eq 0 ]; then
            echo "错误: 符号列表为空" >&2
            exit 1
          fi

      - name: 生成平坦符号列表（用于 UNUSED_KSYMS_WHITELIST）
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/kernel
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/gki_tools/prebuilts/build-tools/linux-x86/bin:$PATH
          chmod +x $GITHUB_WORKSPACE/kernel_workspace/gki_tools/build/abi/flatten_symbol_list
          
          $GITHUB_WORKSPACE/kernel_workspace/gki_tools/build/abi/flatten_symbol_list \
            out/abi_symbollist > out/abi_symbollist.raw
          
          RAW_COUNT=$(wc -l < out/abi_symbollist.raw)
          echo "平坦符号列表已生成 out/abi_symbollist.raw，共 ${RAW_COUNT} 行"

      - name: 修改内核配置（基础部分）
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/kernel
          
          # 修复 Makefile 中的 regalloc 问题
          sed -i '/regalloc-enable-advisor=release/s/^/# /' Makefile
          
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang/bin:$PATH
          export CROSS_COMPILE=$GITHUB_WORKSPACE/kernel_workspace/gcc/bin/aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          clang -v
          ls $GITHUB_WORKSPACE/kernel_workspace/gcc/bin
          
          # 清理配置
          make ARCH=arm64 mrproper CC=clang LD=ld.lld \
            CROSS_COMPILE=$CROSS_COMPILE \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            O=out LLVM=1 LLVM_IAS=1
          
          # 生成基础配置
          make ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=$CROSS_COMPILE \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            O=out LLVM=1 LLVM_IAS=1 gki_defconfig
          
          # 添加自定义配置
          echo 'CONFIG_TMPFS_POSIX_ACL=y' >> arch/arm64/configs/gki_defconfig
          echo 'CONFIG_TMPFS_XATTR=y' >> arch/arm64/configs/gki_defconfig
          echo 'CONFIG_DEBUG_INFO_BTF=y' >> arch/arm64/configs/gki_defconfig
          sed -i 's/CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_CLANG_THIN=y/g' arch/arm64/configs/gki_defconfig
          
          # 重新生成配置
          make ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=$CROSS_COMPILE \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            O=out LLVM=1 LLVM_IAS=1 gki_defconfig

      - name: 启用内核 KMI 修剪（TRIM_NONLISTED_KMI）
        if: env.TRIM_NONLISTED_KMI == '1'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/kernel
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang/bin:$PATH
          export CROSS_COMPILE=$GITHUB_WORKSPACE/kernel_workspace/gcc/bin/aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # 修改 .config 启用 TRIM_UNUSED_KSYMS 并设置白名单
          scripts/config --file out/.config \
            -d UNUSED_SYMBOLS \
            -e TRIM_UNUSED_KSYMS \
            --set-str UNUSED_KSYMS_WHITELIST out/abi_symbollist.raw
          
          # 重新生成配置
          make ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=$CROSS_COMPILE \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            O=out LLVM=1 LLVM_IAS=1 olddefconfig
          
          # 验证配置是否生效
          echo "=========================================="
          echo "验证 KMI 修剪配置"
          echo "=========================================="
          
          if grep -q "CONFIG_TRIM_UNUSED_KSYMS=y" out/.config; then
            echo "✓ CONFIG_TRIM_UNUSED_KSYMS=y [已启用]"
          else
            echo "✗ CONFIG_TRIM_UNUSED_KSYMS 未启用" >&2
            exit 1
          fi
          
          if grep -q "CONFIG_UNUSED_KSYMS_WHITELIST=\"out/abi_symbollist.raw\"" out/.config; then
            echo "✓ CONFIG_UNUSED_KSYMS_WHITELIST 已正确设置"
          else
            echo "✗ CONFIG_UNUSED_KSYMS_WHITELIST 未正确设置" >&2
            exit 1
          fi
          
          echo "内核 KMI 修剪已启用"

      - name: 编译内核（带 KMI 修剪）
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang/bin:$PATH
          export CROSS_COMPILE=$GITHUB_WORKSPACE/kernel_workspace/gcc/bin/aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          echo "=========================================="
          echo "开始编译内核"
          echo "=========================================="
          
          make -C kernel O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            CROSS_COMPILE=$CROSS_COMPILE \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            LLVM=1 \
            LLVM_IAS=1 \
            -j$(nproc --all)
          
          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            echo "✓ 内核编译成功"
            ls -lh kernel/out/arch/arm64/boot/Image
          else
            echo "✗ 内核编译失败: Image 未找到" >&2
            exit 1
          fi

      - name: 严格模式校验（KMI_SYMBOL_LIST_STRICT_MODE）
        if: env.KMI_SYMBOL_LIST_STRICT_MODE == '1'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/kernel
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/gki_tools/prebuilts/build-tools/linux-x86/bin:$PATH
          chmod +x $GITHUB_WORKSPACE/kernel_workspace/gki_tools/build/abi/compare_to_symbol_list
          
          echo "=========================================="
          echo "严格模式 KMI 符号校验"
          echo "=========================================="
          
          # 比较 Module.symvers 与白名单
          if $GITHUB_WORKSPACE/kernel_workspace/gki_tools/build/abi/compare_to_symbol_list \
            out/Module.symvers out/abi_symbollist.raw; then
            echo "✓ 严格模式校验通过"
          else
            echo "✗ 严格模式校验失败: 符号列表不匹配" >&2
            exit 1
          fi

      - name: KMI 符号统计验证
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/kernel
          echo "=========================================="
          echo "KMI 符号统计"
          echo "=========================================="
          
          # 统计实际导出的符号数
          EXPORTED_SYMS=$(grep -c "^0x" out/Module.symvers 2>/dev/null || echo "0")
          # 统计白名单中的符号数
          ALLOWED_SYMS=$(wc -l < out/abi_symbollist.raw)
          
          echo "实际导出的符号数: ${EXPORTED_SYMS}"
          echo "白名单符号数: ${ALLOWED_SYMS}"
          
          if [ "${EXPORTED_SYMS}" -gt "${ALLOWED_SYMS}" ]; then
            echo "⚠ 警告: 导出的符号多于白名单定义 (KMI 膨胀)"
            DIFF=$((EXPORTED_SYMS - ALLOWED_SYMS))
            echo "额外导出了 ${DIFF} 个符号"
          elif [ "${EXPORTED_SYMS}" -lt "${ALLOWED_SYMS}" ]; then
            echo "⚠ 警告: 白名单中的部分符号未导出 (KMI 缩减)"
            DIFF=$((ALLOWED_SYMS - EXPORTED_SYMS))
            echo "缺少 ${DIFF} 个符号"
          else
            echo "✓ 符号数量完全匹配"
          fi
          
          # 如果 KMI_ENFORCED=1，确保严格匹配
          if [ "${{ env.KMI_ENFORCED }}" = "1" ] && [ "${EXPORTED_SYMS}" -ne "${ALLOWED_SYMS}" ]; then
            echo "❌ 错误: KMI_ENFORCED=1 但符号数量不匹配" >&2
            exit 1
          fi
          
          echo "=========================================="
          echo "前 10 个导出的符号示例:"
          grep "^0x" out/Module.symvers | head -10 | awk '{print $2}' || echo "无"
          
          echo "=========================================="
          echo "前 10 个白名单符号示例:"
          head -10 out/abi_symbollist.raw || echo "无"

      - name: 打包 AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/Winkmoon/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          
          # 复制内核镜像
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          
          # 添加内核版本信息和 KMI 校验结果
          echo "${{ env.KERNEL_VERSION }}" > AnyKernel3/kernel_version.txt
          echo "KMI_ENFORCED=${{ env.KMI_ENFORCED }}" > AnyKernel3/kmi_status.txt
          
          cd AnyKernel3
          ZIPNAME="AnyKernel3_${{ env.KERNEL_VERSION }}.zip"
          zip -r "../$ZIPNAME" ./*

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ${{ github.workspace }}/kernel_workspace/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ./release_zips

      - name: 创建 Release
        id: vars
        run: |
          ZIP_FILE=$(ls ./release_zips/*.zip | head -n1)
          KERNEL_VER=$(unzip -p "$ZIP_FILE" kernel_version.txt 2>/dev/null || echo "${{ env.KERNEL_VERSION }}")
          suffix="${{ github.event.inputs.kernel_suffix }}"
          [ -z "$suffix" ] && suffix="${{ env.KERNEL_NAME }}"
          FULL_VERSION="${KERNEL_VER}-${suffix}"
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          TAG_NAME="${{ env.KERNEL_VERSION }}-${{ env.KERNEL_NAME }}-${TIME}"
          echo "FULL_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "TIME_FORM=${TIME_FORM}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "内核 ${{ env.FULL_VERSION }}"
          body: |
            自动构建于 ${{ env.TIME_FORM }}
            内核版本：${{ env.FULL_VERSION }}
            设备：${{ env.CPU }} / ${{ env.FEIL }}
            Android 版本：${{ env.ANDROID_VERSION }}
            KMI 校验：已启用 (KMI_ENFORCED=${{ env.KMI_ENFORCED }})
          files: ./release_zips/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
