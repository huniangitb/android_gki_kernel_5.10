name: kerne-cust-p
env:
  TZ: Asia/Shanghai
  CPU: 'mt6895'
  FEIL: 'redmi+xiaomi'
  ANDROID_VERSION: 'android12'
  KERNEL_VERSION: '5.10.246'
  KERNEL_NAME: 'cust'
  GCC_URL: 'https://github.com/huniangitb/Clang-r584948b/releases/download/v1.0.0/aarch64-linux-android-4.9-refs_tags_android-12.1.0_r27.tar.gz'

on:
  workflow_dispatch:
    inputs:
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 最大化建筑空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 安装基础依赖（移除 pahole，删除 BTF 支持）
        run: |
          sudo apt update
          sudo apt install -y curl bison flex make binutils dwarves git lld zip perl gcc python3 python-is-python3 bc libssl-dev libelf-dev abigail-tools coreutils
          # 确保 dd 可用
          which dd
          sudo ln -sf /usr/bin/dd /bin/dd 2>/dev/null || true

      - name: 初始化源码仓库（预打包工具包）
        run: |
          rm -rf kernel_workspace && mkdir kernel_workspace && cd kernel_workspace
          wget -q -c --show-progress --timeout=30 --tries=30 \
            https://github.com/huniangitb/Clang-r584948b/releases/download/v1.0.0/common-android12-5.10.tar.zst \
            -O common-android12-5.10.tar.zst
          tar -I zstd -xf common-android12-5.10.tar.zst
          rm -rf common 2>/dev/null || true
          git clone --depth=1 https://github.com/ztc1997/android_gki_kernel_5.10_common common -b android12-5.10-2025-09
          rm common/android/abi_gki_protected_exports_* 2>/dev/null || true
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 下载并应用必需补丁
        run: |
          cd kernel_workspace
          mkdir -p patches
          # 补丁 1
          wget -q -O patches/001.fix_sysvipc_kabi.patch \
            https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          # 补丁 2
          wget -q -O patches/002.posix_mqueue_abi_padding.patch \
            https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch
          # 进入内核源码目录应用补丁
          cd common
          patch -p1 < ../patches/001.fix_sysvipc_kabi.patch
          patch -p1 < ../patches/002.posix_mqueue_abi_padding.patch
          echo "补丁应用完成"

      - name: 直接修改 gki_defconfig（添加所需配置，移除 BTF）
        run: |
          cd kernel_workspace
          DEFCONFIG_PATH="common/arch/arm64/configs/gki_defconfig"
          echo "===== 修改前配置关键项 ====="
          grep -E "CONFIG_TMPFS_POSIX_ACL|CONFIG_TMPFS_XATTR|CONFIG_SYSVIPC|CONFIG_POSIX_MQUEUE" "$DEFCONFIG_PATH" || echo "未找到相关项"
          
          # 添加 tmpfs 扩展属性支持
          echo "" >> "$DEFCONFIG_PATH"
          echo "# Custom additions for tmpfs features" >> "$DEFCONFIG_PATH"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_BLK_DEV_IO_TRACE=y" >> "$DEFCONFIG_PATH"
          # 删除 BTF 相关配置（如果存在）
          sed -i '/^CONFIG_DEBUG_INFO_BTF\b/d' "$DEFCONFIG_PATH"
          sed -i '/^CONFIG_DEBUG_INFO\b/d' "$DEFCONFIG_PATH"
          sed -i '/^# CONFIG_DEBUG_INFO is not set\b/d' "$DEFCONFIG_PATH"
          
          # 添加 DroidSpaces 所需配置（每个配置单独 echo）
          echo "" >> "$DEFCONFIG_PATH"
          echo "# DroidSpaces required configs" >> "$DEFCONFIG_PATH"
          echo "CONFIG_SYSVIPC=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_POSIX_MQUEUE=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IPC_NS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_PID_NS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_DEVTMPFS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_NETFILTER_XT_TARGET_REJECT=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_NETFILTER_XT_TARGET_LOG=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET_HASH_IP=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_IP_SET_HASH_NET=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_NETFILTER_XT_SET=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_DEBUG_INFO_REDUCED=y" >> "$DEFCONFIG_PATH"
          
          echo "===== 修改后配置关键项 ====="
          grep -E "CONFIG_TMPFS_POSIX_ACL|CONFIG_TMPFS_XATTR|CONFIG_SYSVIPC|CONFIG_POSIX_MQUEUE|CONFIG_DEBUG_INFO_REDUCED" "$DEFCONFIG_PATH"

      - name: 下载并安装自定义 Clang (r584948b)（移除 GCC）
        run: |
          cd kernel_workspace
          echo "正在从 GitHub 下载 Clang r584948b..."
          wget -q -c --show-progress --timeout=30 --tries=30 https://github.com/huniangitb/Clang-r584948b/releases/download/v1.0.0/linux-x86-kernel-clang-r584948b.tar.gz -O clang-r584948b.tar.gz
          echo "正在解压 Clang..."
          mkdir -p prebuilts-master/clang/host/linux-x86/clang-r584948b
          tar -xzf clang-r584948b.tar.gz -C prebuilts-master/clang/host/linux-x86/clang-r584948b

      - name: 打印工具链详细信息
        run: |
          cd kernel_workspace
          CLANG_BASE="prebuilts-master/clang/host/linux-x86/clang-r584948b"
          CLANG_PATH="$(pwd)/${CLANG_BASE}/bin/clang"
          echo "=========================================="
          echo "Clang 工具链详细信息（已移除 GCC）"
          echo "=========================================="
          echo "编译器路径: ${CLANG_PATH}"
          if [[ -f "${CLANG_PATH}" ]]; then
            ${CLANG_PATH} --version
          else
            echo "错误: 找不到 Clang 编译器！"
            exit 1
          fi

      - name: 添加内核名称后缀
        run: |
          cd kernel_workspace
          echo "替换内核版本后缀..."
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            suffix="${{ github.event.inputs.kernel_suffix }}"
          else
            suffix="${{ env.KERNEL_NAME }}"
          fi
          echo "当前内核版本后缀：${suffix}"
          for f in ./common/scripts/setlocalversion; do
            sed -i "\$s|echo \"\\\$res\"|echo \"-${suffix}\"|" "$f"
          done

      - name: 配置构建环境（纯 Clang 构建，无 GCC）
        run: |
          cd kernel_workspace
          # 禁用 MLGO 相关优化
          sed -i '/regalloc-enable-advisor=release/s/^/# /' common/Makefile
          
          # 替换 Clang 路径为自定义版本
          CLANG_REL_PATH="prebuilts-master/clang/host/linux-x86/clang-r584948b/bin"
          sed -i "s|CLANG_PREBUILT_BIN=prebuilts-master/clang/host/linux-x86/clang-r416183b/bin|CLANG_PREBUILT_BIN=$CLANG_REL_PATH|" common/build.config.common
          
          # 设置纯 Clang 交叉编译参数
          echo 'CLANG_TRIPLE=aarch64-linux-gnu-' >> common/build.config.common
          echo 'CROSS_COMPILE=aarch64-linux-gnu-' >> common/build.config.common
          echo "CC=clang" >> common/build.config.common
          echo "LD=ld.lld" >> common/build.config.common
          echo "AR=llvm-ar" >> common/build.config.common
          echo "NM=llvm-nm" >> common/build.config.common
          echo "STRIP=llvm-strip" >> common/build.config.common
          echo "OBJCOPY=llvm-objcopy" >> common/build.config.common
          echo "OBJDUMP=llvm-objdump" >> common/build.config.common
          echo "READELF=llvm-readelf" >> common/build.config.common
          
          # 移除 GCC 相关变量（如果存在）
          sed -i '/^LINUX_GCC_CROSS_COMPILE_PREBUILTS_BIN/d' common/build.config.common
          
          # 设定详细输出
          echo "V=1" >> common/build.config.common
          
          # 移除 check_defconfig 检查
          sed -i 's/check_defconfig//' ./common/build.config.gki
          
          # 修复 dd 路径问题（如果存在）
          LINK_VMLINUX="common/scripts/link-vmlinux.sh"
          if [[ -f "$LINK_VMLINUX" ]]; then
            sed -i 's/| dd of=/| \/usr\/bin\/dd of=/' "$LINK_VMLINUX"
          fi
          
          echo "构建配置完成（纯 Clang 模式）"
          cat common/build.config.common | grep -E "CROSS_COMPILE|CLANG_PREBUILT_BIN|CC|LD"

      - name: 构建内核（完全使用 Clang，无 BTF）
        run: |
          cd kernel_workspace
          
          # 将 Clang 加入 PATH
          CLANG_BIN="$(pwd)/prebuilts-master/clang/host/linux-x86/clang-r584948b/bin"
          export PATH="${CLANG_BIN}:${PATH}"
          echo "已更新 PATH：${PATH}"
          which clang
          
          export KBUILD_VERBOSE=0
          export HERMETIC_TOOLCHAIN=0
          # 执行构建，过滤无关警告
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh  2>&1 | \
            grep -v -E "lexblock__recode_dwarf_types|tag__recode_dwarf_type|couldn't find 0x|couldn't find|DW_TAG_label" || \
            { exit_code=${PIPESTATUS[0]}; if [ $exit_code -ne 0 ]; then exit $exit_code; fi; }
          
          echo "内核编译完成！"

      - name: 上传额外构建文件 (config, Module.symvers, abi_symbollist.raw, compare_to_symbol_list)
        run: |
          cd kernel_workspace
          mkdir -p build_artifacts
          
          CONFIG_FILE="out/android12-5.10/common/.config"
          if [[ -f "$CONFIG_FILE" ]]; then
            cp "$CONFIG_FILE" build_artifacts/config
            cp "$CONFIG_FILE" "build_artifacts/config_$(date +'%Y%m%d_%H%M%S').txt"
          else
            echo "警告: 未找到 $CONFIG_FILE"
          fi
          
          MODULE_SYMVERS="out/android12-5.10/common/Module.symvers"
          if [[ -f "$MODULE_SYMVERS" ]]; then
            cp "$MODULE_SYMVERS" build_artifacts/
          else
            echo "警告: 未找到 $MODULE_SYMVERS"
          fi
          
          ABI_SYMLIST="out/android12-5.10/common/abi_symbollist.raw"
          if [[ -f "$ABI_SYMLIST" ]]; then
            cp "$ABI_SYMLIST" build_artifacts/
          else
            echo "警告: 未找到 $ABI_SYMLIST"
          fi
          
          COMPARE_SCRIPT="build/abi/compare_to_symbol_list"
          if [[ -f "$COMPARE_SCRIPT" ]]; then
            cp "$COMPARE_SCRIPT" build_artifacts/
          else
            echo "警告: 未找到 $COMPARE_SCRIPT"
          fi
          
          echo "文件收集完成，内容："
          ls -la build_artifacts/

      - name: 上传构建工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Build_Artifacts
          path: kernel_workspace/build_artifacts/

      - name: 克隆 AnyKernel3 并打包
        run: |
          cd kernel_workspace
          git clone https://github.com/Winkmoon/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          IMAGE_FILE=$(find . -name Image | head -n1)
          if [[ -f "$IMAGE_FILE" ]]; then
            cp "$IMAGE_FILE" AnyKernel3/
            echo "已复制内核镜像: $IMAGE_FILE"
          else
            echo "错误：未找到 Image 文件！"
            exit 1
          fi
          cd AnyKernel3
          echo "${{ env.KERNEL_VERSION }}" > kernel_version.txt
          ZIPNAME="AnyKernel3_${{ env.KERNEL_VERSION }}.zip"
          zip -r "../$ZIPNAME" ./*
          echo "打包完成: $ZIPNAME"

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: kernel_workspace/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ./release_zips

      - name: 设置环境变量并创建 Release
        id: vars
        run: |
          ZIP_FILE=$(ls ./release_zips/*.zip | head -n1)
          if [[ -z "$ZIP_FILE" ]]; then
            echo "错误：未找到 ZIP 文件"
            exit 1
          fi
          KERNEL_VER=$(unzip -p "$ZIP_FILE" kernel_version.txt 2>/dev/null || echo "${{ env.KERNEL_VERSION }}")
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FULL_VERSION="${KERNEL_VER}-${{ github.event.inputs.kernel_suffix }}"
          else
            FULL_VERSION="${KERNEL_VER}-${{ env.KERNEL_NAME }}"
          fi
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          TAG_NAME="${{ env.KERNEL_VERSION }}-${{ env.KERNEL_NAME }}-${TIME}"
          echo "FULL_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "TIME=${TIME}" >> $GITHUB_ENV
          echo "TIME_FORM=${TIME_FORM}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: 创建 GitHub Release 并上传内核包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "内核 ${{ env.FULL_VERSION }}"
          body: |
            自动构建于 ${{ env.TIME_FORM }}
            内核版本：${{ env.FULL_VERSION }}
            设备：${{ env.CPU }} / ${{ env.FEIL }}
            Android 版本：${{ env.ANDROID_VERSION }}
          files: ./release_zips/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
