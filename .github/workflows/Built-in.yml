name: Build Kernel
env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android12'
  KERNEL_VERSION: '5.10'
  KERNEL_NAME: 'android_gki_kernel_5.10'
on:
  workflow_dispatch:
    inputs:
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符)'
        required: false
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
    steps:
      - name: 最大化建筑空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
      
      - name: 安装配置环境依赖
        run: |
          sudo apt update -y
          sudo apt install -y \
            build-essential \
            flex bison \
            dwarves \
            libssl-dev \
            libelf-dev \
            bc \
            python3 \
            python-is-python3 \
            make \
            cmake \
            zip \
            curl \
            wget \
            gnupg \
            gcc-multilib \
            g++-multilib \
            ccache \
            rsync \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabihf \
            neofetch
          lscpu
          neofetch
          wget -O LLVM-20.1.0-Linux-X64.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.0/LLVM-20.1.0-Linux-X64.tar.xz
          tar -xvaf LLVM-20.1.0-Linux-X64.tar.xz
          mv LLVM-20.1.0-Linux-X64 aosp-clang
          rm LLVM-20.1.0-Linux-X64.tar.xz
          echo "AOSP_CLANG_PATH=$(pwd)/aosp-clang" >> $GITHUB_ENV
          echo "PATH=$(pwd)/aosp-clang/bin:$PATH" >> $GITHUB_ENV
          
      - name: 初始化源码仓库
        run: |
          rm -rf kernel_workspace && mkdir kernel_workspace && cd kernel_workspace
          git clone --depth=1 https://github.com/huniangitb/android_gki_kernel_5.10_common -b android12-5.10-2025-09 common
          rm common/android/abi_gki_protected_exports_* || true
      
      - name: 添加制作名称
        run: |
          cd kernel_workspace
          cd common
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            for f in ./arch/arm64/configs/xiaomi_diting_defconfig; do
              sed -i "s/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=\"-${{ github.event.inputs.kernel_suffix }}\"/" "$f"
            done
          fi
      
         
      - name: 构建内核
        continue-on-error: true
        env:
          SKIP_ABI_CHECKS: 1
          SKIP_MRPROPER: 1
        run: |
          cd kernel_workspace/common
          
          # 设置环境变量
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export PATH=$AOSP_CLANG_PATH/bin:$PATH
          export LLVM=1
          export LLVM_IAS=0
          export KCFLAGS="-Wno-error -Wno-deprecated-declarations"
          export KBUILD_BUILD_VERSION="0"
          export SOURCE_DATE_EPOCH=$(date +%s)
          
          # 确保输出目录存在
          mkdir -p out
          
          # 配置内核
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 CC="clang"   O=out DEPMOD=depmod gki_defconfig
          
          # 修改配置：禁用 ABI 检查和符号剥离
           
            
          # 重新生成配置
           
          
          # 编译内核（跳过 ABI 检查）
          echo "开始编译内核..."
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 2>&1 | tee build.log
          
          # 检查编译是否成功
          if [ -f out/arch/arm64/boot/Image ]; then
            echo "内核编译成功！"
          else
            echo "警告：内核编译可能未完全成功"
          fi
      
      - name: 克隆 AnyKernel3 并打包
        if: success() || failure()  # 即使编译有警告也继续打包
        run: |
          cd kernel_workspace/common
          git clone https://github.com/Winkmoon/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3
          
          # 检查 Image 文件是否存在
          if [ -f ../out/arch/arm64/boot/Image ]; then
            cp ../out/arch/arm64/boot/Image ./Image
            zip -r ../AnyKernel3_xiaomi_xrga.zip ./*
            echo "打包完成！"
          else
            echo "错误：Image 文件不存在"
            exit 1
          fi
      
      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ${{ github.workspace }}/kernel_workspace/common/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
      
    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ./release_zips
