name: kerne-cust
env:
  TZ: Asia/Shanghai
  CPU: 'mt6895'
  FEIL: 'redmi+xiaomi'
  ANDROID_VERSION: 'android12'
  KERNEL_VERSION: '5.10.246'
  KERNEL_NAME: 'cust'

on:
  workflow_dispatch:
    inputs:
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 最大化建筑空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 安装基础依赖
        run: |
          sudo apt update
          sudo apt install -y clang curl bison flex make binutils dwarves git lld pahole zip perl gcc python3 python-is-python3 bc libssl-dev libelf-dev abigail-tools

      - name: 安装 repo 工具
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: 初始化源码仓库
        run: |
          rm -rf kernel_workspace && mkdir kernel_workspace && cd kernel_workspace
          repo init --depth 1 -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync
          rm -rf common
          echo "正在克隆源码仓库..."
          git clone --depth=1 https://github.com/ztc1997/android_gki_kernel_5.10_common common -b android12-5.10-2025-12
          echo "正在去除 ABI 保护 & 去除 dirty 后缀..."
          rm common/android/abi_gki_protected_exports_* || echo "不需要去除保护"
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 下载并安装自定义 Clang (r547379)
        run: |
          cd kernel_workspace
          echo "正在下载 Clang r547379..."
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz -O clang-r547379.tar.gz
          echo "正在解压 Clang..."
          mkdir -p prebuilts-master/clang/host/linux-x86/clang-r547379
          tar -xzf clang-r547379.tar.gz -C prebuilts-master/clang/host/linux-x86/clang-r547379
          echo "Clang 安装完成，路径: $(pwd)/prebuilts-master/clang/host/linux-x86/clang-r547379"

      - name: 打印 Clang 工具链详细信息
        run: |
          cd kernel_workspace
          CLANG_BASE="prebuilts-master/clang/host/linux-x86/clang-r547379"
          CLANG_PATH="$(pwd)/${CLANG_BASE}/bin/clang"
          echo "=========================================="
          echo "Clang 工具链详细信息"
          echo "=========================================="
          echo "编译器路径: ${CLANG_PATH}"
          if [[ -f "${CLANG_PATH}" ]]; then
            ${CLANG_PATH} --version
          else
            echo "错误: 找不到 Clang 编译器！"
            exit 1
          fi

      - name: 添加内核名称后缀
        run: |
          cd kernel_workspace
          echo "替换内核版本后缀..."
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            suffix="${{ github.event.inputs.kernel_suffix }}"
          else
            suffix="${{ env.KERNEL_NAME }}"
          fi
          echo "当前内核版本后缀：${suffix}"
          for f in ./common/scripts/setlocalversion; do
            sed -i "\$s|echo \"\\\$res\"|echo \"-${suffix}\"|" "$f"
          done

      - name: 配置构建环境 (禁用 MLGO，使用新版 Clang)
        run: |
          cd kernel_workspace
          sed -i '/regalloc-enable-advisor=release/s/^/# /' common/Makefile
          CLANG_REL_PATH="prebuilts-master/clang/host/linux-x86/clang-r547379/bin"
          sed -i "s|CLANG_PREBUILT_BIN=prebuilts-master/clang/host/linux-x86/clang-r416183b/bin|CLANG_PREBUILT_BIN=$CLANG_REL_PATH|" common/build.config.common
          sed -i 's/check_defconfig//' ./common/build.config.gki
          echo "CC=clang" >> common/build.config.common
          echo "构建配置完成"

      - name: 构建内核
        run: |
          cd kernel_workspace
          BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh
          echo "内核编译完成！"

      # ========= 基于官方工具的 ABI 检查 =========
      - name: 准备 ABI 工具环境
        run: |
          cd kernel_workspace
          # 将 kernel-build-tools 添加到 PATH（包含 dump_abi, diff_abi 等）
          export PATH=$PWD/prebuilts/kernel-build-tools/linux-x86/bin:$PATH
          echo "$PWD/build/abi" >> $GITHUB_PATH
          echo "ABI 工具路径: $(which dump_abi 2>/dev/null || echo '未找到 dump_abi')"
          # 确保 dump_abi 脚本可执行
          chmod +x build/abi/dump_abi build/abi/diff_abi 2>/dev/null || true

      - name: 运行 ABI 检查 (不阻断编译流程)
        id: abi_check
        continue-on-error: true
        run: |
          cd kernel_workspace
          # 定义路径
          KERNEL_SRC=$(pwd)/common
          OUT_DIR=$(pwd)/out/android12-5.10/common
          DIST_DIR=$(pwd)/out/android12-5.10/dist
          REF_ABI="${KERNEL_SRC}/android/abi_gki_aarch64.xml"
          CUR_ABI="${DIST_DIR}/abi_current.xml"
          ABI_DIFF="${DIST_DIR}/abi_diff.txt"
          KMI_SYMBOL_LIST="${KERNEL_SRC}/android/abi_gki_aarch64"  # 可选，如果没有符号列表文件可省略
           
          echo "=========================================="
          echo "ABI 检查开始 (基于官方 dump_abi/diff_abi)"
          echo "参考 ABI: ${REF_ABI}"
          echo "内核输出目录: ${OUT_DIR}"
          echo "=========================================="

          # 检查参考文件是否存在
          if [[ ! -f "${REF_ABI}" ]]; then
            echo "⚠️ 跳过 ABI 检查: 找不到参考文件 ${REF_ABI}"
            exit 0
          fi

          # 检查 vmlinux 是否存在
          if [[ ! -f "${OUT_DIR}/vmlinux" ]]; then
            echo "⚠️ 跳过 ABI 检查: 找不到 vmlinux，可能编译失败"
            exit 0
          fi

          # 将 kernel-build-tools 加入 PATH (dump_abi 依赖)
          export PATH=$PWD/prebuilts/kernel-build-tools/linux-x86/bin:$PATH
          # 同时将当前目录的 build/abi 加入 PATH
          export PATH=$PWD/build/abi:$PATH

          echo "生成当前内核的 ABI 表示 (dump_abi)..."
          # 使用 dump_abi 生成当前内核的 ABI XML
          # 参数说明：
          #   --linux-tree: 内核输出目录（包含 vmlinux 和模块）
          #   --out-file: 输出 ABI XML 文件
          #   --kmi-symbol-list: 可选，限制只导出 KMI 符号（如果有符号列表文件）
          if [[ -f "${KMI_SYMBOL_LIST}" ]]; then
            dump_abi --linux-tree ${OUT_DIR} --out-file ${CUR_ABI} --kmi-symbol-list ${KMI_SYMBOL_LIST}
          else
            dump_abi --linux-tree ${OUT_DIR} --out-file ${CUR_ABI}
          fi

          if [[ ! -f "${CUR_ABI}" ]]; then
            echo "⚠️ 生成当前 ABI 失败，跳过检查"
            exit 0
          fi

          echo "=========================================="
          echo "比较 ABI 差异 (diff_abi)..."
          # 使用 diff_abi 比较参考 ABI 和当前 ABI
          # --baseline: 参考 ABI
          # --new: 新 ABI
          # --report: 输出报告文件
          diff_abi --baseline ${REF_ABI} --new ${CUR_ABI} --report ${ABI_DIFF}
          DIFF_RET=$?

          if [[ ${DIFF_RET} -eq 0 ]]; then
            echo "✅ ABI 检查通过: 没有发现差异"
          else
            echo "⚠️ ABI 检查发现差异 (返回码: ${DIFF_RET})"
            echo "差异报告已保存到: ${ABI_DIFF}"
            echo "----- 差异内容 -----"
            cat ${ABI_DIFF}
            echo "-------------------"
          fi

          # 设置输出变量供后续步骤使用
          if [[ -s ${ABI_DIFF} ]]; then
            echo "abi_diff_exist=true" >> $GITHUB_OUTPUT
          else
            echo "abi_diff_exist=false" >> $GITHUB_OUTPUT
          fi

      - name: 上传 ABI 差异报告 (如果有)
        uses: actions/upload-artifact@v4
        with:
          name: ABI_Diff_Report
          path: kernel_workspace/out/android12-5.10/dist/abi_diff.txt
        if: always() && steps.abi_check.outputs.abi_diff_exist == 'true'

      - name: 克隆 AnyKernel3 并打包
        run: |
          cd kernel_workspace
          git clone https://github.com/Winkmoon/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          IMAGE_FILE=$(find . -name Image | head -n1)
          if [[ -f "$IMAGE_FILE" ]]; then
            cp "$IMAGE_FILE" AnyKernel3/
            echo "已复制内核镜像: $IMAGE_FILE"
          else
            echo "错误：未找到 Image 文件！"
            exit 1
          fi
          cd AnyKernel3
          echo "${{ env.KERNEL_VERSION }}" > kernel_version.txt
          ZIPNAME="AnyKernel3_${{ env.KERNEL_VERSION }}.zip"
          zip -r "../$ZIPNAME" ./*
          echo "打包完成: $ZIPNAME"

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: kernel_workspace/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ./release_zips

      - name: 设置环境变量并创建 Release
        id: vars
        run: |
          ZIP_FILE=$(ls ./release_zips/*.zip | head -n1)
          if [[ -z "$ZIP_FILE" ]]; then
            echo "错误：未找到 ZIP 文件"
            exit 1
          fi
          KERNEL_VER=$(unzip -p "$ZIP_FILE" kernel_version.txt 2>/dev/null || echo "${{ env.KERNEL_VERSION }}")
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FULL_VERSION="${KERNEL_VER}-${{ github.event.inputs.kernel_suffix }}"
          else
            FULL_VERSION="${KERNEL_VER}-${{ env.KERNEL_NAME }}"
          fi
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          TAG_NAME="${{ env.KERNEL_VERSION }}-${{ env.KERNEL_NAME }}-${TIME}"
          echo "FULL_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "TIME=${TIME}" >> $GITHUB_ENV
          echo "TIME_FORM=${TIME_FORM}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: 创建 GitHub Release 并上传内核包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "内核 ${{ env.FULL_VERSION }}"
          body: |
            自动构建于 ${{ env.TIME_FORM }}
            内核版本：${{ env.FULL_VERSION }}
            设备：${{ env.CPU }} / ${{ env.FEIL }}
            Android 版本：${{ env.ANDROID_VERSION }}
          files: ./release_zips/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
