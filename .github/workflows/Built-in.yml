name: ShirokoNekoKernel-xaga

env:
  TZ: Asia/Shanghai
  CPU: 'mt6895'
  FEIL: 'redmi+xiaomi'
  ANDROID_VERSION: 'android12'
  KERNEL_VERSION: '5.10'
  KERNEL_NAME: 'cust'

on:
  workflow_dispatch:
    inputs:
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 最大化建筑空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 安装配置环境依赖
        run: |
          sudo apt update
          sudo apt install -y llvm clang cmake curl bison flex make binutils dwarves git lld pahole zip perl gcc python3 python-is-python3 bc libssl-dev libelf-dev

      - name: Install repo tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: 初始化源码仓库
        run: |
          rm -rf kernel_workspace && mkdir kernel_workspace && cd kernel_workspace
          repo init --depth 1 -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync
          rm -rf common
          echo "正在克隆源码仓库..."
          git clone --depth=1 https://github.com/ztc1997/android_gki_kernel_5.10_common common -b android12-5.10-2025-12
          echo "正在去除 ABI 保护 & 去除 dirty 后缀..."
          rm common/android/abi_gki_protected_exports_* || echo "不需要去除保护"
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 添加制作名称
        run: |
          cd kernel_workspace
          echo "替换内核版本后缀..."
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            suffix="${{ github.event.inputs.kernel_suffix }}"
          else
            suffix="${{ env.KERNEL_NAME }}"
          fi
          echo "当前内核版本后缀：${suffix}"
          for f in ./common/scripts/setlocalversion; do
            sed -i "\$s|echo \"\\\$res\"|echo \"-${suffix}\"|" "$f"
          done

      - name: 构建内核
        run: |
          cd kernel_workspace
          export LTO=thin SYSTEM_DLKM_RE_SIGN=0 BUILD_SYSTEM_DLKM=0 KMI_SYMBOL_LIST_STRICT_MODE=0
          sed -i '/Makefile/d' common/scripts/Makefile.clean
          sed -i 's# include $(KO_CODE_PATH)/platform/$(MALI_PLATFORM_DIR)/Kbuild# include $(KO_CODE_PATH)/platform/mt6895/Kbuild#g' common/drivers/gpu/mediatek/mali-valhall/gpu/arm/midgard/Makefile || true
          BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh || echo "完毕"
          echo "内核编译完成！"

      - name: 克隆 AnyKernel3 并打包
        run: |
          cd kernel_workspace
          git clone https://github.com/Winkmoon/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          # 复制找到的第一个 Image 文件（通常只有一个）
          IMAGE_FILE=$(find . -name Image | head -n1)
          if [[ -f "$IMAGE_FILE" ]]; then
            cp "$IMAGE_FILE" AnyKernel3/
          else
            echo "错误：未找到 Image 文件！"
            exit 1
          fi
          cd AnyKernel3
          # 生成内核版本信息文件，供 release 使用
          echo "${{ env.KERNEL_VERSION }}" > kernel_version.txt
          ZIPNAME="AnyKernel3_${{ env.KERNEL_VERSION }}.zip"
          zip -r "../$ZIPNAME" ./*

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: kernel_workspace/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ./release_zips

      - name: 设置环境变量
        id: vars
        run: |
          ZIP_FILE=$(ls ./release_zips/*.zip | head -n1)
          if [[ -z "$ZIP_FILE" ]]; then
            echo "错误：未找到 ZIP 文件"
            exit 1
          fi
          # 从 zip 内读取内核版本，若无则使用 env 中的版本
          KERNEL_VER=$(unzip -p "$ZIP_FILE" kernel_version.txt 2>/dev/null || echo "${{ env.KERNEL_VERSION }}")
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FULL_VERSION="${KERNEL_VER}-${{ github.event.inputs.kernel_suffix }}"
          else
            FULL_VERSION="${KERNEL_VER}-${{ env.KERNEL_NAME }}"
          fi
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          TAG_NAME="${{ env.KERNEL_VERSION }}-${{ env.KERNEL_NAME }}-${TIME}"
          echo "FULL_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "TIME=${TIME}" >> $GITHUB_ENV
          echo "TIME_FORM=${TIME_FORM}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: 创建 GitHub Release 并上传内核包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "内核 ${{ env.FULL_VERSION }}"
          body: |
            自动构建于 ${{ env.TIME_FORM }}
            内核版本：${{ env.FULL_VERSION }}
            设备：${{ env.CPU }} / ${{ env.FEIL }}
            Android 版本：${{ env.ANDROID_VERSION }}
          files: ./release_zips/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
