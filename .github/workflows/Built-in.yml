name: ShirokoNekoKernel-xaga

env:
  TZ: Asia/Shanghai
  CPU: 'mt6895'
  FEIL: 'redmi+xiaomi'
  ANDROID_VERSION: 'android12'
  KERNEL_VERSION: '5.10'
  KERNEL_NAME: 'cust'

on:
  workflow_dispatch:
    inputs:
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 最大化建筑空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 安装基础依赖
        run: |
          sudo apt update
          sudo apt install -y clang curl bison flex make binutils dwarves git lld pahole zip perl gcc python3 python-is-python3 bc libssl-dev libelf-dev

      - name: 安装 repo 工具
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: 初始化源码仓库
        run: |
          rm -rf kernel_workspace && mkdir kernel_workspace && cd kernel_workspace
          repo init --depth 1 -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync
          rm -rf common
          echo "正在克隆源码仓库..."
          git clone --depth=1 https://github.com/ztc1997/android_gki_kernel_5.10_common common -b android12-5.10-2025-12
          echo "正在去除 ABI 保护 & 去除 dirty 后缀..."
          rm common/android/abi_gki_protected_exports_* || echo "不需要去除保护"
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 下载并安装自定义 Clang (r547379)
        run: |
          cd kernel_workspace
          echo "正在下载 Clang r547379..."
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz -O clang-r547379.tar.gz
          echo "正在解压 Clang..."
          mkdir -p prebuilts-master/clang/host/linux-x86
          tar -xzf clang-r547379.tar.gz -C prebuilts-master/clang/host/linux-x86
          cd prebuilts-master/clang/host/linux-x86
          # 查找解压出来的目录（排除 . 和 ..）
          EXTRACTED_DIR=$(ls -d */ 2>/dev/null | grep -v '^\.' | head -n1)
          if [[ -n "$EXTRACTED_DIR" && "$EXTRACTED_DIR" != "clang-r547379/" ]]; then
            echo "重命名 $EXTRACTED_DIR 为 clang-r547379"
            mv "$EXTRACTED_DIR" clang-r547379
          fi
          cd ../../../../
          echo "Clang 安装完成，路径: $(pwd)/prebuilts-master/clang/host/linux-x86/clang-r547379"

      - name: 打印 Clang 工具链详细信息
        run: |
          cd kernel_workspace
          CLANG_BASE="prebuilts-master/clang/host/linux-x86/clang-r547379"
          CLANG_PATH="$(pwd)/${CLANG_BASE}/bin/clang"
          
          echo "=========================================="
          echo "Clang 工具链详细信息"
          echo "=========================================="
          echo "基础路径: $(pwd)/${CLANG_BASE}"
          echo "编译器路径: ${CLANG_PATH}"
          echo ""
          
          echo "目录结构检查:"
          if [[ -d "${CLANG_BASE}" ]]; then
            echo "✓ Clang 根目录存在"
            echo ""
            echo "bin 目录内容:"
            ls -la "${CLANG_BASE}/bin/" | head -30
            echo ""
            echo "lib64 目录内容:"
            ls -la "${CLANG_BASE}/lib64/" | head -20
            echo ""
          else
            echo "✗ Clang 根目录不存在！"
            exit 1
          fi
          
          echo "=========================================="
          echo "编译器版本信息:"
          if [[ -f "${CLANG_PATH}" ]]; then
            ${CLANG_PATH} --version
            echo ""
            echo "编译器目标信息:"
            ${CLANG_PATH} -v 2>&1 | grep "Target:"
            echo ""
            echo "默认搜索路径:"
            ${CLANG_PATH} -print-search-dirs 2>&1 | head -10
          else
            echo "✗ 找不到 clang 可执行文件！"
            exit 1
          fi
          echo "=========================================="

      - name: 添加内核名称后缀
        run: |
          cd kernel_workspace
          echo "替换内核版本后缀..."
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            suffix="${{ github.event.inputs.kernel_suffix }}"
          else
            suffix="${{ env.KERNEL_NAME }}"
          fi
          echo "当前内核版本后缀：${suffix}"
          for f in ./common/scripts/setlocalversion; do
            sed -i "\$s|echo \"\\\$res\"|echo \"-${suffix}\"|" "$f"
          done

      - name: 配置构建环境 (禁用 MLGO，使用新版 Clang)
        run: |
          cd kernel_workspace
          echo "正在配置构建环境..."
          
          # 1. 禁用 MLGO 参数
          sed -i '/regalloc-enable-advisor=release/s/^/# /' common/Makefile
          
          # 2. 修改 build.config.common 指向新的 Clang
          CLANG_ABS_PATH="$(pwd)/prebuilts-master/clang/host/linux-x86/clang-r547379/bin"
          sed -i "s|CLANG_PREBUILT_BIN=prebuilts-master/clang/host/linux-x86/clang-r416183b/bin|CLANG_PREBUILT_BIN=$CLANG_ABS_PATH|" common/build.config.common
          
          # 3. 跳过 defconfig 检查
          sed -i 's/check_defconfig//' ./common/build.config.gki
          
          echo "构建配置完成"
          echo "CLANG_PREBUILT_BIN 设置为: $CLANG_ABS_PATH"
          echo ""
          echo "验证 build.config.common 中的配置:"
          grep "CLANG_PREBUILT_BIN" common/build.config.common || echo "警告: 未找到 CLANG_PREBUILT_BIN 配置"

      - name: 构建内核
        run: |
          cd kernel_workspace
          
          # 设置 Clang 环境变量
          CLANG_DIR="$(pwd)/prebuilts-master/clang/host/linux-x86/clang-r547379"
          export PATH="${CLANG_DIR}/bin:${PATH}"
          export LD_LIBRARY_PATH="${CLANG_DIR}/lib64:${LD_LIBRARY_PATH}"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1 LLVM_IAS=1
          
          echo "=========================================="
          echo "构建环境配置"
          echo "=========================================="
          echo "CLANG_DIR: ${CLANG_DIR}"
          echo "PATH 中的 clang: $(which clang 2>/dev/null || echo '未找到')"
          echo "LD_LIBRARY_PATH: ${LD_LIBRARY_PATH}"
          echo "CLANG_TRIPLE: ${CLANG_TRIPLE}"
          echo "LLVM: ${LLVM}"
          echo "=========================================="
          
          echo "编译器验证:"
          clang --version
          echo "=========================================="
          echo "链接器验证:"
          ld.lld --version || echo "ld.lld 未找到"
          echo "=========================================="
          
          echo "开始编译内核..."
          BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh
          
          echo "内核编译完成！"

      - name: 克隆 AnyKernel3 并打包
        run: |
          cd kernel_workspace
          git clone https://github.com/Winkmoon/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          IMAGE_FILE=$(find . -name Image | head -n1)
          if [[ -f "$IMAGE_FILE" ]]; then
            cp "$IMAGE_FILE" AnyKernel3/
            echo "已复制内核镜像: $IMAGE_FILE"
          else
            echo "错误：未找到 Image 文件！"
            exit 1
          fi
          cd AnyKernel3
          echo "${{ env.KERNEL_VERSION }}" > kernel_version.txt
          ZIPNAME="AnyKernel3_${{ env.KERNEL_VERSION }}.zip"
          zip -r "../$ZIPNAME" ./*
          echo "打包完成: $ZIPNAME"

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: kernel_workspace/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ./release_zips

      - name: 设置环境变量并创建 Release
        id: vars
        run: |
          ZIP_FILE=$(ls ./release_zips/*.zip | head -n1)
          if [[ -z "$ZIP_FILE" ]]; then
            echo "错误：未找到 ZIP 文件"
            exit 1
          fi
          KERNEL_VER=$(unzip -p "$ZIP_FILE" kernel_version.txt 2>/dev/null || echo "${{ env.KERNEL_VERSION }}")
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FULL_VERSION="${KERNEL_VER}-${{ github.event.inputs.kernel_suffix }}"
          else
            FULL_VERSION="${KERNEL_VER}-${{ env.KERNEL_NAME }}"
          fi
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          TAG_NAME="${{ env.KERNEL_VERSION }}-${{ env.KERNEL_NAME }}-${TIME}"
          echo "FULL_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "TIME=${TIME}" >> $GITHUB_ENV
          echo "TIME_FORM=${TIME_FORM}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: 创建 GitHub Release 并上传内核包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "内核 ${{ env.FULL_VERSION }}"
          body: |
            自动构建于 ${{ env.TIME_FORM }}
            内核版本：${{ env.FULL_VERSION }}
            设备：${{ env.CPU }} / ${{ env.FEIL }}
            Android 版本：${{ env.ANDROID_VERSION }}
          files: ./release_zips/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
