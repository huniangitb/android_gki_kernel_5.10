name: ShirokoNekoKernel-xaga

env:
  TZ: Asia/Shanghai
  CPU: 'mt6895'
  FEIL: 'redmi+xiaomi'
  ANDROID_VERSION: 'android12'
  KERNEL_VERSION: '5.10'
  KERNEL_NAME: 'cust'

on:
  workflow_dispatch:
    inputs:
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 最大化建筑空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 安装基础依赖
        run: |
          sudo apt update
          sudo apt install -y clang curl bison flex make binutils dwarves git lld pahole zip perl gcc python3 python-is-python3 bc libssl-dev libelf-dev

      - name: 下载并替换 Clang (r547379)
        run: |
          # 下载新版 clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz -O clang-r547379.tar.gz
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          # 替换默认的 prebuilts-master 路径（构建系统会优先使用这个）
          rm -rf kernel_workspace/prebuilts-master/clang 2>/dev/null || true
          mkdir -p kernel_workspace/prebuilts-master/clang/host/linux-x86
          cp -r prebuilts/clang/host/linux-x86/clang-r547379 kernel_workspace/prebuilts-master/clang/host/linux-x86/clang-r547379
          # 创建软链接或直接设置环境变量，稍后在构建步骤中会修改 build.config.common

      - name: Install repo tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: 初始化源码仓库
        run: |
          rm -rf kernel_workspace && mkdir kernel_workspace && cd kernel_workspace
          repo init --depth 1 -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync
          rm -rf common
          echo "正在克隆源码仓库..."
          git clone --depth=1 https://github.com/ztc1997/android_gki_kernel_5.10_common common -b android12-5.10-2025-12
          echo "正在去除 ABI 保护 & 去除 dirty 后缀..."
          rm common/android/abi_gki_protected_exports_* || echo "不需要去除保护"
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 添加制作名称
        run: |
          cd kernel_workspace
          echo "替换内核版本后缀..."
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            suffix="${{ github.event.inputs.kernel_suffix }}"
          else
            suffix="${{ env.KERNEL_NAME }}"
          fi
          echo "当前内核版本后缀：${suffix}"
          for f in ./common/scripts/setlocalversion; do
            sed -i "\$s|echo \"\\\$res\"|echo \"-${suffix}\"|" "$f"
          done

      - name: 配置构建环境 (禁用 MLGO，使用新版 Clang)
        run: |
          cd kernel_workspace
          # 1. 禁用 MLGO 参数（注释掉两行）
          sed -i '/regalloc-enable-advisor=release/s/^/# /' common/Makefile
          # 或者完全删除： sed -i '/regalloc-enable-advisor=release/d' common/Makefile
          
          # 2. 修改 build.config.common 指向新的 Clang
          sed -i 's|CLANG_PREBUILT_BIN=prebuilts-master/clang/host/linux-x86/clang-r416183b/bin|CLANG_PREBUILT_BIN=prebuilts-master/clang/host/linux-x86/clang-r547379/bin|' common/build.config.common
          
          # 3. 可选：跳过 defconfig 检查（避免之前出现的配置不匹配错误）
          sed -i 's/check_defconfig//' ./common/build.config.gki
          
          # 4. 其他需要的调整
          export LTO=thin SYSTEM_DLKM_RE_SIGN=0 BUILD_SYSTEM_DLKM=0 KMI_SYMBOL_LIST_STRICT_MODE=0
          # 修复可能的 Mali 路径问题（允许失败）
          sed -i 's# include $(KO_CODE_PATH)/platform/$(MALI_PLATFORM_DIR)/Kbuild# include $(KO_CODE_PATH)/platform/mt6895/Kbuild#g' common/drivers/gpu/mediatek/mali-valhall/gpu/arm/midgard/Makefile || true

      - name: 构建内核
        run: |
          cd kernel_workspace
          
          # 确保使用新的 clang（环境变量覆盖)
          export CLANG_DIR=$(pwd)/prebuilts-master/clang/host/linux-x86/clang-r547379
          export PATH="${CLANG_DIR}/bin:${PATH}"
          export LD_LIBRARY_PATH="${CLANG_DIR}/lib64:${LD_LIBRARY_PATH}"
          export PATH=$(pwd)/prebuilts-master/clang/host/linux-x86/clang-r547379/bin:$PATH
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1 LLVM_IAS=1
          which clang || echo "clang not in PATH"
          clang --version || echo "clang 无法运行"
          BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh || echo "构建命令执行完毕（忽略错误）"
          echo "内核编译完成！"

      - name: 克隆 AnyKernel3 并打包
        run: |
          cd kernel_workspace
          git clone https://github.com/Winkmoon/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          IMAGE_FILE=$(find . -name Image | head -n1)
          if [[ -f "$IMAGE_FILE" ]]; then
            cp "$IMAGE_FILE" AnyKernel3/
          else
            echo "错误：未找到 Image 文件！"
            exit 1
          fi
          cd AnyKernel3
          echo "${{ env.KERNEL_VERSION }}" > kernel_version.txt
          ZIPNAME="AnyKernel3_${{ env.KERNEL_VERSION }}.zip"
          zip -r "../$ZIPNAME" ./*

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: kernel_workspace/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ./release_zips

      - name: 设置环境变量并创建 Release
        id: vars
        run: |
          ZIP_FILE=$(ls ./release_zips/*.zip | head -n1)
          if [[ -z "$ZIP_FILE" ]]; then
            echo "错误：未找到 ZIP 文件"
            exit 1
          fi
          KERNEL_VER=$(unzip -p "$ZIP_FILE" kernel_version.txt 2>/dev/null || echo "${{ env.KERNEL_VERSION }}")
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FULL_VERSION="${KERNEL_VER}-${{ github.event.inputs.kernel_suffix }}"
          else
            FULL_VERSION="${KERNEL_VER}-${{ env.KERNEL_NAME }}"
          fi
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          TAG_NAME="${{ env.KERNEL_VERSION }}-${{ env.KERNEL_NAME }}-${TIME}"
          echo "FULL_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "TIME=${TIME}" >> $GITHUB_ENV
          echo "TIME_FORM=${TIME_FORM}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: 创建 GitHub Release 并上传内核包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "内核 ${{ env.FULL_VERSION }}"
          body: |
            自动构建于 ${{ env.TIME_FORM }}
            内核版本：${{ env.FULL_VERSION }}
            设备：${{ env.CPU }} / ${{ env.FEIL }}
            Android 版本：${{ env.ANDROID_VERSION }}
          files: ./release_zips/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
