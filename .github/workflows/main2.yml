name: kerne-cust2
env:
  TZ: Asia/Shanghai
  CPU: 'mt6895'
  FEIL: 'redmi+xiaomi'
  ANDROID_VERSION: 'android12'
  KERNEL_VERSION: '5.10.246'
  KERNEL_NAME: 'cust'
  REPO_URL: 'https://mirrors.tuna.tsinghua.edu.cn/git/git-repo'

on:
  workflow_dispatch:
    inputs:
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 最大化建筑空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 安装基础依赖（包含 zstd）
        run: |
          sudo apt update
          sudo apt install -y curl bison flex make binutils dwarves git lld pahole zip perl gcc python3 python-is-python3 bc libssl-dev libelf-dev abigail-tools coreutils zstd
          sudo ln -sf /usr/bin/dd /bin/dd 2>/dev/null || true

      - name: 安装 repo 工具
        run: |
          curl -s https://mirrors.tuna.tsinghua.edu.cn/git/git-repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo
          git config --global repo.url https://mirrors.tuna.tsinghua.edu.cn/git/git-repo

      - name: 初始化源码仓库（使用预打包 tarball）
        run: |
          rm -rf kernel_workspace && mkdir kernel_workspace && cd kernel_workspace
          wget -q -c --show-progress --timeout=30 --tries=30 \
            https://github.com/huniangitb/Clang-r584948b/releases/download/v1.0.0/common-android12-5.10.tar.zst \
            -O common-android12-5.10.tar.zst
          tar -I zstd -xf common-android12-5.10.tar.zst
          rm -rf common 2>/dev/null || true
          git clone --depth=1 https://github.com/ztc1997/android_gki_kernel_5.10_common common -b android12-5.10-2025-09
          rm common/android/abi_gki_protected_exports_* 2>/dev/null || true
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 直接修改 gki_defconfig
        run: |
          cd kernel_workspace
          DEFCONFIG_PATH="common/arch/arm64/configs/gki_defconfig"
          echo -e "\n# Custom additions for tmpfs features" >> "$DEFCONFIG_PATH"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG_PATH"
          sed -i '/^CONFIG_DEBUG_INFO\b/d' "$DEFCONFIG_PATH"
          sed -i '/^# CONFIG_DEBUG_INFO is not set\b/d' "$DEFCONFIG_PATH"
          sed -i '/^CONFIG_DEBUG_INFO_BTF\b/d' "$DEFCONFIG_PATH"
          echo -e "\n# BTF support" >> "$DEFCONFIG_PATH"
          echo "CONFIG_DEBUG_INFO=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_DEBUG_INFO_BTF=y" >> "$DEFCONFIG_PATH"

      - name: 下载并安装 Clang
        run: |
          cd kernel_workspace
          wget -q -c --show-progress https://github.com/huniangitb/Clang-r584948b/releases/download/v1.0.0/linux-x86-kernel-clang-r584948b.tar.gz -O clang-r584948b.tar.gz
          mkdir -p prebuilts-master/clang/host/linux-x86/clang-r584948b
          tar -xzf clang-r584948b.tar.gz -C prebuilts-master/clang/host/linux-x86/clang-r584948b

      - name: 打印 Clang 版本
        run: |
          cd kernel_workspace
          CLANG_PATH="$(pwd)/prebuilts-master/clang/host/linux-x86/clang-r584948b/bin/clang"
          ${CLANG_PATH} --version

      - name: 添加内核名称后缀
        run: |
          cd kernel_workspace
          suffix="${{ github.event.inputs.kernel_suffix }}"
          [ -z "$suffix" ] && suffix="${{ env.KERNEL_NAME }}"
          for f in ./common/scripts/setlocalversion; do
            sed -i "\$s|echo \"\\\$res\"|echo \"-${suffix}\"|" "$f"
          done

      - name: 修复 xdp_sock.h 中的前向声明（解决 BTF unresolved symbol）
        run: |
          cd kernel_workspace/common
          # 将前向声明替换为包含完整定义，避免 BTF 类型不一致
          sed -i 's/^struct xdp_buff;$/#include <net\/xdp.h>/' include/net/xdp_sock.h
          echo "已修改 include/net/xdp_sock.h"

      - name: 配置构建环境（不写入 PAHOLE_FLAGS 到配置文件）
        run: |
          cd kernel_workspace
          sed -i '/regalloc-enable-advisor=release/s/^/# /' common/Makefile
          CLANG_REL_PATH="prebuilts-master/clang/host/linux-x86/clang-r584948b/bin"
          sed -i "s|CLANG_PREBUILT_BIN=prebuilts-master/clang/host/linux-x86/clang-r416183b/bin|CLANG_PREBUILT_BIN=$CLANG_REL_PATH|" common/build.config.common
          sed -i 's/check_defconfig//' ./common/build.config.gki
          echo "CC=clang" >> common/build.config.common
          echo "KBUILD_VERBOSE=0" >> common/build.config.common
          LINK_VMLINUX="common/scripts/link-vmlinux.sh"
          if [[ -f "$LINK_VMLINUX" ]]; then
            sed -i 's/| dd of=/| \/usr\/bin\/dd of=/' "$LINK_VMLINUX"
          fi
          # 注意：不再写入 PAHOLE_FLAGS，改为在构建步骤中通过环境变量传递
          echo "构建配置完成"

      - name: 构建内核（通过环境变量传递 PAHOLE_FLAGS）
        run: |
          cd kernel_workspace
          
          export PATH="/usr/bin:$PATH"
          export KBUILD_VERBOSE=0
          
          # 通过环境变量设置 PAHOLE_FLAGS，避免 shell 解析问题
          export PAHOLE_FLAGS="--skip_encoding_btf_inconsistent_proto --skip_encoding_btf_vars"
          
          echo "=========================================="
          echo "使用的 PAHOLE_FLAGS: ${PAHOLE_FLAGS}"
          echo "=========================================="
          
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh 2>&1 | \
            grep -v -E "lexblock__recode_dwarf_types|tag__recode_dwarf_type|couldn't find 0x|couldn't find|DW_TAG_label" || \
            { exit_code=${PIPESTATUS[0]}; if [ $exit_code -ne 0 ]; then exit $exit_code; fi; }
          
          echo "内核编译完成！"

      - name: 上传额外构建文件
        run: |
          cd kernel_workspace
          mkdir -p build_artifacts
          [ -f "out/android12-5.10/common/.config" ] && cp "out/android12-5.10/common/.config" build_artifacts/config
          [ -f "out/android12-5.10/common/Module.symvers" ] && cp "out/android12-5.10/common/Module.symvers" build_artifacts/
          [ -f "out/android12-5.10/common/abi_symbollist.raw" ] && cp "out/android12-5.10/common/abi_symbollist.raw" build_artifacts/
          [ -f "build/abi/compare_to_symbol_list" ] && cp "build/abi/compare_to_symbol_list" build_artifacts/
          ls -la build_artifacts/

      - name: 上传构建工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Build_Artifacts
          path: kernel_workspace/build_artifacts/

      - name: 克隆 AnyKernel3 并打包
        run: |
          cd kernel_workspace
          git clone https://github.com/Winkmoon/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          IMAGE_FILE=$(find . -name Image | head -n1)
          if [[ ! -f "$IMAGE_FILE" ]]; then
            echo "错误：未找到 Image 文件"
            exit 1
          fi
          cp "$IMAGE_FILE" AnyKernel3/
          cd AnyKernel3
          echo "${{ env.KERNEL_VERSION }}" > kernel_version.txt
          ZIPNAME="AnyKernel3_${{ env.KERNEL_VERSION }}.zip"
          zip -r "../$ZIPNAME" ./*
          echo "打包完成"

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: kernel_workspace/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v4
        with:
          name: Kernel_ZIP_Artifacts
          path: ./release_zips

      - name: 创建 Release
        id: vars
        run: |
          ZIP_FILE=$(ls ./release_zips/*.zip | head -n1)
          KERNEL_VER=$(unzip -p "$ZIP_FILE" kernel_version.txt 2>/dev/null || echo "${{ env.KERNEL_VERSION }}")
          suffix="${{ github.event.inputs.kernel_suffix }}"
          [ -z "$suffix" ] && suffix="${{ env.KERNEL_NAME }}"
          FULL_VERSION="${KERNEL_VER}-${suffix}"
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          TAG_NAME="${{ env.KERNEL_VERSION }}-${{ env.KERNEL_NAME }}-${TIME}"
          echo "FULL_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "TIME_FORM=${TIME_FORM}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "内核 ${{ env.FULL_VERSION }}"
          body: |
            自动构建于 ${{ env.TIME_FORM }}
            内核版本：${{ env.FULL_VERSION }}
            设备：${{ env.CPU }} / ${{ env.FEIL }}
            Android 版本：${{ env.ANDROID_VERSION }}
          files: ./release_zips/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
